function _normId(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');}
/* GRANDEZZE DI SISTEMA (07ago2026) — non sono campi del prodotto ma esistono nello
   scope: il traduttore deve poterle nominare in italiano. I campi veri vincono sempre
   (si cercano prima), quindi un prodotto che ha un campo "colore" non viene scavalcato. */
var _GRANDEZZE={
  cliente:'cliente', cliente_cod:'cliente_cod', codice_cliente:'cliente_cod',
  agente:'agente', listino:'listino', ricarico:'ricarico',
  area:'area', superficie_riposo:'area', metri_quadri:'area', mq:'area',
  altezza_totale:'hTot', htot:'hTot', spessore_totale:'hTot',
  molle:'molleN', numero_molle:'molleN', numero_strati:'nStrati', n_strati:'nStrati',
  zone:'zone', numero_zone:'zone', inserti:'inserti', numero_inserti:'inserti', zigzag:'zigzag'
};
function _resolveCampo(token,campi){var tk=_normId(token);
  for(var i=0;i<campi.length;i++){var c=campi[i];if(_normId(c.id)===tk||_normId(c.label)===tk)return c.id;}
  for(var i=0;i<campi.length;i++){var c=campi[i];if(_normId(c.label).indexOf(tk)>=0||(tk&&_normId(c.id).indexOf(tk)>=0))return c.id;}
  if(_GRANDEZZE[tk])return _GRANDEZZE[tk];
  /* (07ago2026) le colonne dell'anagrafica clienti sono parole valide: l'elenco
     non e' scritto nel codice, si legge dai dati caricati. */
  try{
    var _cols={}; (ANAG.clienti||[]).forEach(function(c){ Object.keys(c).forEach(function(k){ _cols[_normId(k)]=1; }); });
    if(_cols[tk]) return tk;
    if(tk.indexOf('cliente_')===0 && _cols[tk.slice(8)]) return tk;
  }catch(e){}
  return null;}
function _condExpr(cond,campi){var parts=cond.split(/\s+(e|o)\s+/i),out='',ok=true;
  for(var i=0;i<parts.length;i++){var p=parts[i];
    if(/^(e|o)$/i.test(p)){out+=(p.toLowerCase()==='e'?' && ':' || ');continue;}
    /* CONFRONTO NUMERICO (07ago2026) — prima esisteva solo l'uguaglianza:
       «se altezza > 32» non si poteva scrivere in italiano. */
    var mn=p.match(/(.+?)\s*(>=|<=|>|<|maggiore\s+(?:di|a)|minore\s+(?:di|a)|almeno|al\s*massimo|oltre|sopra|sotto)\s*([0-9]+(?:[.,][0-9]+)?)\s*(?:mm|cm|m|kg|m²|mq|°)?\s*$/i);
    if(mn){
      var f=_resolveCampo(mn[1],campi); if(!f){ok=false;continue;}
      var o=mn[2].toLowerCase().replace(/\s+/g,' ');
      var js = /^(>=|almeno)$/.test(o) ? '>=' : /^(<=|al massimo)$/.test(o) ? '<='
             : /^(>|maggiore di|maggiore a|oltre|sopra)$/.test(o) ? '>'
             : /^(<|minore di|minore a|sotto)$/.test(o) ? '<' : '>';
      out+='EN('+f+')'+js+parseFloat(mn[3].replace(',','.'));
      continue;
    }
    /* Gli operatori a PAROLA vogliono spazi attorno (07ago2026): senza, la «e» di
       «uguale» spezzava il nome del campo — «cliente è DEAMICI» diventava campo «cli».
       Era un bug preesistente, mascherato dal fallback parseRegolaLib. */
    var m=p.match(/^(.+?)\s*(!=|:|=)\s*['"]?([^'"]+?)['"]?\s*$/);
    if(!m) m=p.match(/^(.+?)\s+(diverso\s+da|non\s+è|non\s+e|uguale\s+a|è|e)\s+['"]?([^'"]+?)['"]?\s*$/i);
    if(!m){ok=false;continue;}
    var field=_resolveCampo(m[1],campi);if(!field){ok=false;continue;}
    var neg=/!=|diverso|non /i.test(m[2]);
    out+=(neg?'!':'')+"EQ("+field+",'"+m[3].trim().replace(/'/g,'')+"')";}
  return {expr:out||'false',ok:ok};}
/* Di quale campo parla questa regola? Serve a raggrupparle:
   con trenta regole in fila l'Officina non si governa più. */
function _regolaCampo(txt,campi){
  var m=String(txt||'').match(/se\s+(.+?)\s+allora/i);
  if(!m)return null;
  var cond=m[1];
  var best=null, pos=1e9;
  (campi||[]).forEach(function(c){
    [c.id, c.label].forEach(function(n){
      if(!n)return;
      var i=cond.toLowerCase().indexOf(String(n).toLowerCase());
      if(i>=0 && i<pos){ pos=i; best=c; }
    });
  });
  return best;
}
/* (11ago2026) «SEMPRE» — una regola che vale a prescindere. Prima serviva una
   condizione, e per aumentare un listino si scriveva «se lunghezza > 0», che e'
   un trucco: vero sempre, ma illeggibile per chi apre la tabella fra un anno.
   Ora si scrive «sempre ricarico +5%» e basta. */
function parseVincolo(txt,campi){
  var _semp=String(txt||'').match(/^\s*sempre\s+(.+)$/i);
  if(_semp){
    var finto=parseVincolo('se _x = _x allora '+_semp[1], campi);
    if(finto){ finto.se='true'; if(finto.msg) finto.msg='sempre — '+finto.msg; return finto; }
  }
  return _parseVincolo_(txt,campi);
}
function _parseVincolo_(txt,campi){var t=String(txt||'').trim();
  var m=t.match(/se\s+(.+?)\s+allora\s+(.+)/i);if(!m)return null;
  var cond=m[1],az=m[2],c=_condExpr(cond,campi);if(!c.ok)return null;var am;
  /* RICARICO (07ago2026) — la regola DECIDE il ricarico, non maggiora il prezzo finale.
     «ricarico 1.28» → assoluto, sostituisce il listino del cliente
     «ricarico +12%» / «ricarico del listino +12%» → parte dal listino e lo maggiora
     Va PRIMA della maggiorazione: altrimenti la % la intercetta lei. */
  /* BLOCCO (07ago2026) — «blocca» · «vietato» · «non ammesso» · «non consentito».
     Ferma la registrazione dell'ordine (ordineHaBlocchi). Prima l'unico modo di
     bloccare era la forma «X deve essere >= N»: una combinazione vietata fra due
     campi diversi non si poteva dichiarare. */
  if(/^\s*(blocca|vieta|vietat|non\s+ammess|non\s+consentit|non\s+si\s+pu|impedisci)/i.test(az)){
    return {se:'('+c.expr+')', tipo:'avviso', valore:0, sev:'block',
            msg:'Combinazione non ammessa — '+az.trim()};
  }
  /* PROVVIGIONE (07ago2026) — «provvigione 5%» · «provvigione 0» (azzera l'agente) */
  if(/provvigion/i.test(az)){
    var pv=az.match(/([0-9]+(?:[.,][0-9]+)?)\s*%?/);
    if(pv) return {se:'('+c.expr+')', tipo:'provvigione', valore:parseFloat(pv[1].replace(',','.')),
                   sev:'info', msg:'Provvigione agente '+pv[1]+'%'};
  }
  /* TEMPO (07ago2026) — «+8 minuti in Taglio» · «tempo Assemblaggio 12 minuti» */
  var tm=az.match(/([+\-]?[0-9]+(?:[.,][0-9]+)?)\s*(?:min|minut)/i);
  if(tm && /tempo|minut|attrezz|lavorazion|reparto|in\s+[A-Za-zÀ-ù]/i.test(az)){
    var rep=az.match(/(?:in|reparto|su)\s+([A-Za-zÀ-ù]+)/i);
    return {se:'('+c.expr+')', tipo:'tempo', valore:parseFloat(tm[1].replace(',','.')),
            reparto:(rep?rep[1].charAt(0).toUpperCase()+rep[1].slice(1).toLowerCase():'Lavorazione'),
            fase:az.trim(), sev:'info', msg:tm[1]+' min · '+(rep?rep[1]:'Lavorazione')};
  }
  if(/ricaric|listino/i.test(az)){
    var rp=az.match(/([+\-]?[0-9]+(?:[.,][0-9]+)?)\s*%/);
    if(rp){
      var pv=parseFloat(rp[1].replace(',','.'));
      var giuR=/(sconto|riduz|diminu|in\s+meno)/i.test(az)||pv<0;
      var fatt=1+(giuR?-Math.abs(pv):Math.abs(pv))/100;
      return {se:'('+c.expr+')', tipo:'ricarico', valore:'ricarico*'+fatt, sev:'warn',
              msg:'Ricarico '+(giuR?'−':'+')+Math.abs(pv)+'% sul listino'};
    }
    var ra=az.match(/([0-9]+[.,][0-9]+)/);
    if(ra){
      var av=parseFloat(ra[1].replace(',','.'));
      if(av>0) return {se:'('+c.expr+')', tipo:'ricarico', valore:String(av), sev:'info',
                       msg:'Ricarico dedicato '+av+' (sostituisce il listino)'};
    }
  }
  /* «costa il 12% in più» · «prezzo +12%» · «maggiorazione del 12%» · «sconto del 5%»
     → una MAGGIORAZIONE vera sul prezzo (il motore la sa già applicare, mancava chi la scrivesse) */
  var mg=az.match(/([0-9]+(?:[.,][0-9]+)?)\s*%/);
  if(mg && /prezz|cost|maggior|aument|ricaric|supplement|sconto|riduz/i.test(az)){
    var perc=parseFloat(mg[1].replace(',','.'));
    var giu=/(sconto|riduz|diminu|in\s+meno)/i.test(az);
    return {se:'('+c.expr+')', tipo:'maggiora', valore:(giu?-perc:perc), sev:'info',
            msg:(giu?'−':'+')+perc+'% sul prezzo'};
  }
  if(am=az.match(/(.+?)\s+deve\s+essere\s+['\"]?([^'\"]+?)['\"]?\s*$/i)){
    var field=_resolveCampo(am[1],campi);if(!field)return null;var val=am[2].trim().replace(/'/g,'');
    /* «deve essere >= 800» è un CONFRONTO, non un'uguaglianza con la scritta ">= 800".
       Prima li trattavo come testo: la regola scattava sempre, anche quando era rispettata. */
    /* «multiplo di alzata» → confronto vero: il resto della divisione dev'essere zero */
    var mu=val.match(/multipl[oi]\s+(?:di\s+|dell[ao]\s+)?([a-z0-9_ àèéìòù]+?)(?:\s*\(|$)/i);
    if(mu){
      var f2=_resolveCampo(mu[1],campi);
      if(f2) return {se:'('+c.expr+') && !(EN('+f2+')>0 && Math.abs(EN('+field+') % EN('+f2+'))<0.001)',
                     sev:'block', msg:am[1].trim()+' deve essere un multiplo di '+mu[1].trim()};
    }
    var cf=val.match(/^(>=|<=|>|<|=|almeno|al\s*meno|minimo|non\s+meno\s+di|al\s*massimo|massimo|non\s+pi[uù]\s+di)\s*([0-9]+(?:[.,][0-9]+)?)\s*(?:mm|cm|m|kg|°)?$/i);
    if(cf){
      var op=cf[1].toLowerCase().replace(/\s+/g,' ');
      var n=parseFloat(cf[2].replace(',','.'));
      var js = /^(>=|almeno|al meno|minimo|non meno di)$/.test(op) ? '>='
             : /^(<=|al massimo|massimo|non più di|non piu di)$/.test(op) ? '<='
             : op==='>' ? '>' : op==='<' ? '<' : '==';
      return {se:'('+c.expr+') && !(EN('+field+') '+js+' '+n+')', sev:'block',
              msg:am[1].trim()+' deve essere '+js+' '+n};
    }
    /* Un blocco si può fare solo se il valore è VERIFICABILE: dev'essere uno dei valori
       dichiarati del campo, o un numero. Altrimenti è una frase che non so misurare:

    var cc=(campi||[]).filter(function(x){return x.id===field;})[0];
    var ammessi=(cc&&(cc.opz||cc.std)||[]).map(function(x){return String(x).toLowerCase().trim();});
    var vLow=val.toLowerCase().trim();
    var verificabile = ammessi.indexOf(vLow)>=0 || /^[0-9]+([.,][0-9]+)?$/.test(vLow);
    if(!verificabile)
      return {se:'('+c.expr+')', sev:'warn', msg:am[1].trim()+': '+val};
    return {se:'('+c.expr+') && !EQ('+field+",'"+val+"')", sev:'block', msg:am[1].trim()+' deve essere "'+val+'"'};}
  if(/non\s+selezionabil|vietat|obblig/i.test(az))
    return {se:'('+c.expr+')', sev:'block', msg:az.replace(/^.*?allora\s*/i,'')};
  return {se:'('+c.expr+')', sev:'warn', msg:az.replace(/^avviso[:\s]*/i,'').replace(/^['\"]|['\"]$/g,'')};}

function parseRegolaLib(txt){
  var t=(txt||'').toLowerCase(),cond=null,m;
  if(m=t.match(/(?:se\s+)?(\w+)\s+(?:=|è|uguale a|:)?\s*(\w+)/)){}
  var azione=null,val=0;
  if(m=t.match(/maggior\w*\s*(?:del\s*)?(\d+)/)){azione='maggiora';val=+m[1];}
  else if(/viet/.test(t))azione='avviso';
  else if(/avvis/.test(t))azione='avviso';
  // condizione: "se X è/uguale Y" oppure "se X > n"
  var se='true';
  if(m=t.match(/se\s+([a-zàèéìòù_]+)\s*(?:=|è|uguale a|:)\s*([a-zàèéìòù0-9]+)/)) se="String("+m[1]+")==='"+m[2]+"'";
  else if(m=t.match(/se\s+([a-zàèéìòù_]+)\s*>\s*(\d+)/)) se=m[1]+">"+m[2];
  /* Se non ho capito la condizione, la regola NON deve scattare (07ago2026).
     Prima il default era se:'true' — una frase incomprensibile si applicava a
     ogni prodotto, in silenzio. Ora non scatta e lo dichiara. */
  if(se==='true') return {se:'false', tipo:'avviso', valore:0,
    msg:'⚠ regola non tradotta — riscrivila come «se <campo> <operatore> <valore> allora <azione>»: '+txt,
    sev:'warn'};
  return {se:se, tipo:azione||'avviso', valore:val, msg:txt, sev: azione==='maggiora'?'info':'warn'};
}

function narratoreAnalizza(cb){
  var aspetti=(officina.geo&&officina.geo.dichiarazione&&officina.geo.dichiarazione.testi)||[];
  var payload={identita:officina.identita, descrizione:officina.info, aspetti:aspetti,

  var done=false;function fin(j,f){if(done)return;done=true; if(j&&j.motore==='dxf'&&officina.geo&&!j.geom)j.geom=officina.geo.geom; cb(j,f);}
  setTimeout(function(){fin(bozzaEsempio(),'esempio');},45000);  // il Superrisponditore ha tempo; solo se non risponde → esempio
  fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(d){var txt=(d&&(d.text||d.answer))||'';var j=JSON.parse(txt.replace(/```json|```/g,''));fin(j,'deepseek');})
    .catch(function(){fin(bozzaEsempio(),'esempio');});
}

function _valori(c){
  var V=(c.std&&c.std.length)?c.std.map(String):((c.opz||[]).map(String));
  if(c.cod) V=V.map(function(v){ return (c.cod[v]!=null)? (v+'='+c.cod[v]) : v; });   /* mostro la sigla */
  return V;
}
function _soloNumeri(V){ return V.length>0 && V.every(function(x){return String(x).trim()!=='' && !isNaN(parseFloat(String(x).replace(',','.')));}); }
function _setValori(c,arr){
  arr=arr.filter(function(s){return String(s).trim()!=='';});
  /* «rosso=ROS» → il valore resta «rosso», la SIGLA per il codice articolo diventa «ROS».
     Serve perché il gestionale vuole GRA#ROS23ROV, non GRA#ROSSO23ROVERE. */
  var sigle={}, puliti=arr.map(function(s){
    var m=String(s).match(/^(.+?)\s*=\s*(.+)$/);
    if(m){ sigle[m[1].trim()]=m[2].trim(); return m[1].trim(); }
    return String(s).trim();
  });
  if(Object.keys(sigle).length){ c.cod=Object.assign({},c.cod||{},sigle); } 
  arr=puliti;
  if(!arr.length){ c.tipo='testo'; delete c.std; delete c.opz; delete c.min; delete c.max; }
  else if(_soloNumeri(arr)){ c.tipo='num'; c.std=arr; delete c.opz; }
  else { c.tipo='scelta'; c.opz=arr; delete c.std; delete c.min; delete c.max; }
}

      if(String(g.id).replace(/_\d{10,}$/,'')===_base) _gia=g;
    });
    var slug, libId;
    if(_gia){
      if(confirm('Esiste gia\' il mondo «'+(_gia.nome||_base)+'».\n\nOK = lo AGGIORNO con questa versione\nAnnulla = ne creo uno nuovo accanto')){
        slug=_gia.id;
        (_gia.libs||[]).forEach(function(l){ delete LIB[l]; });   /* via la vecchia versione */
        libId=slug+'_lib';
        _gia.nome=officina.titolo||d.nome; _gia.primary=libId; _gia.libs=[libId];
        LIB[libId]=lib;
        attivazione[slug]=true; mondoCorrente=slug; mondoAttivo=libId; nuovaCommessa();
        closeOfficina();
        ordine.righe.push({lib:libId,cfg:JSON.parse(JSON.stringify(lib.cfgDefault)),qta:1});rigaAttiva=0;
        _salvaMondi(); renderAll();
        if(typeof _avviso==='function') _avviso('Mondo «'+(_gia.nome)+'» aggiornato.');
        return;
      }
      slug=_base+'_'+Date.now();
    } else {
      slug=_base;                                            /* primo del suo nome: niente numero appiccicato */
    }
    libId=slug+'_lib';
    LIB[libId]=lib;
    GRUPPI.push({id:slug,nome:officina.titolo||d.nome,primary:libId,libs:[libId],sealed:true});
    attivazione[slug]=true;                 // tu lo attivi (nel banco: attivo subito)
    mondoCorrente=slug; mondoAttivo=libId; nuovaCommessa();
    closeOfficina();
    ordine.righe.push({lib:libId,cfg:JSON.parse(JSON.stringify(lib.cfgDefault)),qta:1});rigaAttiva=0;
    _salvaMondi();
    boot();
  } else {
    // completa un prodotto dentro il mondo esistente
    LIB[id]=lib;
    var G=GRUPPI.find(function(x){return x.libs.indexOf(id)>=0;});
    if(!G){GRUPPI.find(function(x){return x.id===mondoCorrente;}).libs.push(id);}
    closeOfficina();
    ordine.righe.push({lib:id,cfg:JSON.parse(JSON.stringify(lib.cfgDefault)),qta:1});rigaAttiva=ordine.righe.length-1;
    _salvaMondi();
    boot();
  }
}

boot();
</script>
