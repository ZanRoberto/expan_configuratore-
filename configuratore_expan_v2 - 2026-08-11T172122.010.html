var MANUALE=[{"i":0,"cap":"METODO MATRICE — MANUALE D'USO","tit":"METODO MATRICE — MANUALE D'USO","txt":"*Scritto sull'applicazione reale, non su come dovrebbe essere.\nVersione 11 agosto 2026.*\n\n---","tag":""},{"i":1,"cap":"METODO MATRICE — MANUALE D'USO","tit":"COME LEGGERE QUESTO MANUALE","txt":"Le sezioni **1–3** servono a chi usa il sistema tutti i giorni.\nLe sezioni **4–7** a chi lo governa: regole, anagrafiche, prodotti.\nLa sezione **8** è l'elenco delle cose che il sistema **non** fa — leggila prima di\nprometterle a un cliente.\n\nOgni volta che compare il segno ⚠ c'è una cosa che si dimentica facilmente e che\ncosta tempo o errori.\n\n---","tag":"anagrafiche cliente regole"},{"i":2,"cap":"I TRE RUOLI","tit":"I TRE RUOLI","txt":"Il sistema si comporta in modo diverso a seconda di chi lo sta usando.\n\n| ruolo | cosa vede | come si attiva |\n|---|---|---|\n| **operatore** | prodotto, prezzo, offerta | è il modo normale |\n| **supervisor** | + analisi costi, Officina, anagrafica, mondi | pulsante `ruolo:` in alto |\n| **responsabile regole** | + il quadro regole e la loro modifica | pulsante `R ⚿` + password |\n\n⚠ Il pulsante `R ⚿` è **separato dal ruolo**. Un supervisor senza la password non\nvede né modifica le regole. La password si cambia nel file: cerca\n`REGOLE_PWD_SHA` e sostituisci l'impronta SHA-256 della nuova.\n\n⚠ L'apertura delle regole dura **quanto la scheda del browser**. Chiudendola si\nrichiude da sola.\n\n---","tag":"anagrafica mondi officina password prezzo regole regole_pwd_sha ruolo"},{"i":4,"cap":"IL GIRO NORMALE — dalla richiesta all'offerta","tit":"Scegliere il cliente","txt":"In testa all'ordine. Il cliente decide **listino, ricarico, provvigione** e attiva\nle regole che lo riguardano.\n\n⚠ Cambiare cliente ricalcola tutto: prezzo, provvigione, regole. Non è un dato\nanagrafico, è una variabile del calcolo.","tag":"anagrafico cliente listino prezzo provvigione regole ricarico"},{"i":5,"cap":"IL GIRO NORMALE — dalla richiesta all'offerta","tit":"Due strade per configurare","txt":"**◇ parti dall'intervista** — il sistema fa le domande e propone il prodotto.\n**+ Materasso / + Cuscino / …** — si sceglie il prodotto e si compila a mano.\n\nEntrambe legittime. Ma il prodotto porta scritto quale hai usato:\n\n`◇ da intervista` (petrolio) · `⚠ senza intervista` (ambra)\n\n⚠ La traccia arriva anche all'ERP, nel campo `origine_configurazione`. Chi salta\nl'intervista non sbaglia — ma resta scritto, e l'offerta sarà più povera di\ninformazioni per chi produce.","tag":"intervista"},{"i":6,"cap":"IL GIRO NORMALE — dalla richiesta all'offerta","tit":"Registrare","txt":"**Registra ordine** congela la commessa. Da lì il prodotto non si modifica più.\n\n⚠ Se una regola di **blocco** è violata, la registrazione è impedita e il motivo\ncompare in rosso. Non è un avviso da ignorare.\n\n---","tag":"regola"},{"i":8,"cap":"L'INTERVISTA","tit":"Come funziona","txt":"Le domande si adattano alle risposte. Sopra le domande, il sistema dichiara sempre\ndove sta andando:\n\n- *\"Ancora possibili: Materasso · Cuscino · Damiano\"* — sta ancora restringendo\n- *\"Da qui in poi siamo su Materasso — deciso da: …\"* — la famiglia si è chiusa\n- *\"Nessuna famiglia regge queste risposte\"* — vicolo cieco, con il motivo","tag":"famiglia"},{"i":9,"cap":"L'INTERVISTA","tit":"Le risposte «dalla famiglia»","txt":"Quando la famiglia si chiude, le domande a cui il prodotto ha già risposto **non\nsi fanno**. Compaiono nello storico con l'etichetta *dalla famiglia*.\n\nNon è una scorciatoia: chiederle sarebbe una finta scelta.","tag":"famiglia"},{"i":10,"cap":"L'INTERVISTA","tit":"Le opzioni spente","txt":"Un'opzione che violerebbe una regola di prodotto resta visibile ma **spenta**, con\nil motivo sotto. Non sparisce, così sai dire al cliente perché no.\n\n⚠ Se **tutte** le opzioni sono spente, il problema è una risposta precedente.\nTorna indietro cliccando una risposta nello storico.","tag":"cliente regola"},{"i":11,"cap":"L'INTERVISTA","tit":"Tornare indietro","txt":"Ogni risposta nello storico è cliccabile. Ci torni sopra e le successive si\nricalcolano.","tag":""},{"i":12,"cap":"L'INTERVISTA","tit":"Cosa esce alla fine","txt":"| caso | cosa succede |\n|---|---|\n| il prodotto copre le risposte | nasce un prodotto normale |\n| copre meno del 70%, o ci sono differenze | nasce una **variante da approvare** (viola) |\n| nessuna famiglia regge | scegli tu la linea, nasce comunque |\n| una guardia di prodotto è violata | non nasce: si dice cosa lo impedisce |\n\n⚠ Le risposte **restano attaccate al prodotto** e viaggiano fino all'ERP. Si vedono\nnel riquadro *DALL'INTERVISTA*, con il conteggio di quante sono state applicate.\n\nUna risposta che non trova un campo dove andare è marcata *senza campo*: resta agli\natti ma non ha effetto. **Se ce ne sono molte, l'intervista è disallineata dal\nprodotto** e va corretta.\n\n---","tag":"approvare famiglia guardia intervista intervista variante"},{"i":14,"cap":"LE REGOLE","tit":"Dove vivono","txt":"| dove | cosa contiene |\n|---|---|\n| **libreria del prodotto** (Officina) | vincoli fisici: le guardie |\n| **Anagrafica ▸ REGOLE** | accordi cliente e regole d'azienda |","tag":"anagrafica cliente guardie officina regole regole"},{"i":15,"cap":"LE REGOLE","tit":"Come si scrivono — in italiano","txt":"```\nse altezza totale > 32 allora ricarico +12%\nse cliente è Ospedaliera e area > 3 allora ricarico 1.28\nse paese non è Italia allora ricarico +6%\nse colore è rosso e cliente è Nautica allora blocca\nse materiale è MEMORY allora +8 minuti in Taglio\nsempre ricarico +5%\n```\n\n**Confronti:** `>` `<` `>=` `<=` · `è` · `non è` · `diverso da`\n**Unione:** `e` · `o`\n**Senza condizione:** `sempre <azione>`","tag":"cliente materiale ricarico"},{"i":16,"cap":"LE REGOLE","tit":"Cosa può fare una regola","txt":"| azione | scrittura | effetto |\n|---|---|---|\n| prezzo | `prezzo +10%` | maggiora il prezzo finale |\n| ricarico | `ricarico 1.28` · `ricarico +12%` | sostituisce il listino |\n| provvigione | `provvigione 3%` | fissa la % agente |\n| tempo | `+8 minuti in Taglio` | aggiunge minuti a un reparto |\n| blocco | `blocca` · `vietato` | impedisce la registrazione |\n| avviso | `avviso <testo>` | messaggio, non ferma |","tag":"listino prezzo provvigione regola ricarico"},{"i":17,"cap":"LE REGOLE","tit":"Su cosa vale — le colonne di REGOLE","txt":"| cliente | prodotto | vale per |\n|---|---|---|\n| `*` | `*` | tutti |\n| `MEDSRL` | `*` | quel cliente, tutti i prodotti |\n| `*` | `materasso` | **tutta la famiglia** materasso |\n| `*` | `Materasso Damiano` | solo quel prodotto |\n\n⚠ Il filtro per **famiglia** funziona solo se i prodotti la dichiarano nella\ncolonna `famiglia` di CARATTERISTICHE.\n\n**Precedenza:** cliente batte azienda — la riga più specifica vince.\n**Eccezione assoluta:** le guardie di prodotto non si scavalcano mai.","tag":"caratteristiche cliente famiglia guardie regole"},{"i":18,"cap":"LE REGOLE","tit":"Il quadro regole","txt":"Nel prodotto, con `R ⚿` aperto. Per ogni regola dice:\n\n| stato | significa |\n|---|---|\n| **attiva** (ambra) | è scattata, con l'effetto accanto |\n| **ferma / non violata** | condizione non verificata — è normale per una guardia |\n| **annullata** (barrata) | un'altra regola l'ha sovrascritta |\n| **NON VALUTABILE** (rossa) | nomina un campo che non esiste: **non scatterà mai** |\n\nE la **bandiera** dice da dove viene: `—` prodotto · `✱` azienda · `nome cliente`.\n\n⚠ Sopra il quadro c'è il **contesto**: `cliente = … · ricarico … · listino …`.\nSe una regola non scatta e non capisci perché, la risposta è quasi sempre lì.\n\n⚠ **Le regole si modificano sul posto**: matita ✎ su ogni riga. Quelle\nd'anagrafica hanno la matita tratteggiata ⌂ e si correggono in Anagrafica.\n\n---","tag":"anagrafica anagrafica cliente guardia listino regola regole ricarico"},{"i":19,"cap":"LE ANAGRAFICHE","tit":"LE ANAGRAFICHE","txt":"Dieci tabelle. Si riempiono a mano (`＋ aggiungi riga`, salva automatico) o da CSV.\n\n| tabella | serve a |\n|---|---|\n| **CLIENTI** | offerta, ERP, **e le sue colonne diventano parole per le regole** |\n| **MATERIALI** | densità, natura, costo al kg o al pezzo, scarto |\n| **BLOCCHI** | formato del cubotto per materiale |\n| **COSTI** | costo blocco e resa in lamine (via storica) |\n| **FORNITORI** | il cliente impone il fornitore |\n| **LISTINI** | ricarico e provvigione per cliente |\n| **REGOLE** | accordi e condizioni |\n| **CARATTERISTICHE** | cosa dichiara ogni prodotto — serve all'intervista |\n| **COMPOSIZIONE** | da una risposta alla stratigrafia |\n| **INTERVISTA** | le domande |","tag":"anagrafiche blocchi caratteristiche cliente clienti composizione csv intervista intervista listini materiale materiali provvigione regole regole ricarico"},{"i":20,"cap":"LE ANAGRAFICHE","tit":"La regola dell'asterisco","txt":"`*` vale per tutti. La riga più specifica vince. Vale su ogni colonna filtro.","tag":"regola"},{"i":21,"cap":"LE ANAGRAFICHE","tit":"Le colonne in più non si buttano","txt":"Se aggiungi `paese` al CSV clienti, quella colonna **diventa una parola scrivibile\nin una regola** la sera stessa. È il meccanismo che rende il sistema estensibile\nsenza programmatore.","tag":"clienti csv regola"},{"i":22,"cap":"LE ANAGRAFICHE","tit":"Importare un CSV","txt":"⚠ **Ogni file nel suo riquadro.** Se sbagli, il sistema rifiuta e dice quale\ncolonna manca — leggi il messaggio prima di chiuderlo.\n\n⚠ **L'importazione sostituisce**, non somma.\n\n⚠ **Serve l'intestazione** come prima riga.\n\n⚠ Dopo l'importazione **controlla il numero di righe** accanto al titolo. Se non\nè quello atteso, il file non è entrato.","tag":"csv"},{"i":23,"cap":"LE ANAGRAFICHE","tit":"Il pannello DA DICHIARARE","txt":"Ambra, nel prodotto. Elenca cosa il prodotto nomina e l'anagrafica non conosce —\ncon la domanda da girare a chi la sa.\n\n⚠ *\"Finché restano aperte, il costo di queste voci è zero — e uno zero non si\nvede.\"* È la frase più importante del sistema.\n\n---","tag":"anagrafica"},{"i":25,"cap":"I PRODOTTI","tit":"Officina","txt":"**modifica in Officina** su un prodotto. Da lì:\n\n- **Campi** — cosa il prodotto dichiara. Con `min`/`max` o con valori a scelta.\n- **＋ lista FORI** — fori passanti, posizione dal centro in mm\n- **＋ ZONE di lavorazione** — zonizzazione lungo la lunghezza\n- **Grammatica del codice** — come nasce il codice articolo\n- **Regole** — le guardie del prodotto","tag":"fori fori guardie officina regole zone"},{"i":26,"cap":"I PRODOTTI","tit":"Le zone — la doppia natura","txt":"| campo | natura |\n|---|---|\n| `da %` `a %` | **scala** con la lunghezza — la zona segue il corpo |\n| `lx` `ly` in mm | **NON scala** — la misura la decide l'attrezzatura |\n| `mat` + `resa` | se dichiarati, la zona genera righe di distinta |\n| `min` + `reparto` | se dichiarati, la zona genera minuti di ciclo |\n\n⚠ Se il materiale è vuoto la zona è **solo lavorazione**: non genera componenti.","tag":"distinta materiale misura zone"},{"i":27,"cap":"I PRODOTTI","tit":"Le varianti di cliente","txt":"Quando modifichi un prodotto uscendo dalla sua famiglia, compare la proposta di\nfarne un modello nuovo. Il nome è già proposto — prodotto + cliente.\n\n⚠ La variante **non crea una libreria**: marca la riga. Altrimenti ogni cliente\ngenererebbe un mondo nuovo in barra.\n\n⚠ Nasce **da approvare**, non confermata.","tag":"approvare cliente famiglia mondo variante varianti"},{"i":28,"cap":"I PRODOTTI","tit":"Il riconoscimento","txt":"`GIÀ FATTO — IDENTICO` o `MAI FATTO — PRIMA VOLTA`, con le offerte precedenti.\n\nIl pulsante **riparti** prende **solo la configurazione**, lasciando il cliente e\nl'ordine di adesso. Le regole del cliente corrente si riapplicano da sole.\n\n⚠ Cliccare la **riga** invece riapre l'ordine intero, cliente compreso.\n\n---","tag":"cliente regole"},{"i":29,"cap":"I PRODOTTI","tit":"La composizione e l'unità di misura","txt":"Le righe di **COMPOSIZIONE** scrivono gli spessori degli strati. Ma l'unità la\ndecide **il prodotto**, non la riga:\n\n| prodotto | misure in | esempio |\n|---|---|---|\n| Materasso | **centimetri** | `HR35:5` = 5 cm |\n| Materasso Damiano | **millimetri** | `HR35VERDE:40` = 40 mm |\n\n⚠ È l'errore più insidioso del sistema: scrivere `4` pensando ai centimetri su un\nprodotto in millimetri dà un materasso alto un dito, e il motore non protesta —\nfa quello che gli si dice.\n\n⚠ Il sistema **avvisa** quando la somma degli strati si allontana di oltre il 35%\ndallo spessore dichiarato, e suggerisce l'unità sbagliata. L'avviso compare fra i\nmessaggi del prodotto.\n\n**Regola pratica:** dopo aver scritto una riga di composizione, somma gli spessori\ne confrontali con il campo spessore del prodotto. Devono somigliarsi.","tag":"composizione composizione misura misure regola spessore spessori unità"},{"i":30,"cap":"I PRODOTTI","tit":"Le varianti si approvano","txt":"Una variante nasce `da approvare`. Non è un'etichetta: finché non è approvata\n**l'ordine non si registra**.\n\n⚠ **L'offerta si può fare comunque.** Quotare è lecito e serve: il commerciale deve\ncapire se il cliente ci sta. Mandare in produzione un prodotto che nessuno ha\napprovato, no.\n\n**Come si chiede** — pulsante `chiedi approvazione` accanto alla pastiglia viola.\nLa richiesta va sul server, non in una mail: una mail resta nella casella di chi\nla legge e il sistema non ne sa niente.\n\n**Come si risponde** — chi approva vede in barra `◈ 2 da approvare`. Apre, legge\nvariante, prodotto d'origine, cliente e ordine, e preme **approva** o **rifiuta**.\nIl rifiuto chiede un motivo, che il commerciale vedrà.\n\n**La scadenza** — la richiesta vale **60 minuti**. Se nessuno risponde, scade e\ndiventa rossa: il commerciale lo sa e può dire al cliente «le confermo domani»\ninvece di aspettare al buio. Una richiesta scaduta si può rifare.\n\n⚠ Lo stato si legge **dal server**: il commerciale vede la risposta comparire\nmentre è ancora seduto davanti al cliente, senza ricaricare.\n\n| stato | pastiglia | l'ordine si registra? |\n|---|---|---|\n| da approvare | viola | no |\n| in attesa… | ambra | no |\n| approvata | petrolio | **sì** |\n| rifiutata | ambra scuro, col motivo | no |\n| scaduta | ambra scuro | no — si richiede |\n\n⚠ Il tempo di scadenza si cambia nel file: costante `APPROVA_MINUTI`.","tag":"approva approva_minuti approvano approvare approvata approvato approvazione cliente variante varianti"},{"i":31,"cap":"MONDI E AMBIENTE CLIENTE","tit":"MONDI E AMBIENTE CLIENTE","txt":"**manopola attivazione** — accende e spegne i mondi visibili al cliente.\n\n⚠ L'attivazione è **permanente**: sopravvive al ricaricamento.\n⚠ Spegnere non cancella. Per cancellare serve un'azione diversa e **non è\nreversibile**.\n⚠ I **clienti sono dell'azienda**, non del mondo: spegnere un mondo non toglie i\nsuoi clienti dagli altri.\n\n---","tag":"cliente cliente clienti mondi mondi mondo"},{"i":32,"cap":"QUELLO CHE IL SISTEMA NON FA","tit":"QUELLO CHE IL SISTEMA NON FA","txt":"### Da leggere prima di prometterlo\n\n| cosa | stato |\n|---|---|\n| Costo lavorazione con **doppia tariffa** macchina/uomo e operatori | **non c'è** — una tariffa sola per reparto |\n| **Provvigione** — noi sul margine, gli ERP spesso sul prezzo finale | **formula diversa**, da allineare |\n| **Conflitti fra regole** sullo stesso bersaglio | vince l'ultima, **in silenzio** |\n| **Livello ordine**: quantità, lotto, trasporto, scaglioni | **non c'è** — le regole valutano la riga |\n| **Misure fuori catalogo** dove il campo è una tendina | non scrivibili |\n| **Divieti d'azienda** per cliente o paese | le regole d'azienda maggiorano, non vietano |\n| **Notifica** a chi approva (mail, messaggio) | non c'è — chi approva controlla la lista |\n| Tempo di lavorazione **dichiarato per componente** con la sua origine | parziale |\n| **Zone nel 3D**: disegnate ✔ · nella distinta ✔ · nei cicli ✔ | completo |\n| **Distinta a livelli** (semilavorati con codice proprio) | non c'è |\n| **Tolleranze** sulle misure | non c'è |\n| **Magazzino, giacenze, approvvigionamento** | **fuori perimetro** — è dell'ERP |\n\n---","tag":"approva approvvigionamento cicli cliente distinta distinta misure misure prezzo provvigione regole zone"},{"i":33,"cap":"I DIECI ERRORI CHE COSTANO PIÙ TEMPO","tit":"I DIECI ERRORI CHE COSTANO PIÙ TEMPO","txt":"1. **Importare un CSV nel riquadro sbagliato** — leggi il messaggio di rifiuto.\n2. **Non controllare il numero di righe** dopo un'importazione.\n3. **CSV senza intestazione** — viene rifiutato.\n4. **Scrivere una regola su un campo che non esiste** — resta `NON VALUTABILE`.\n5. **Cercare una regola che non scatta** senza guardare il contesto sopra il quadro.\n6. **Dimenticare la colonna `famiglia`** e poi stupirsi che il filtro non filtri.\n7. **Ricaricare la pagina** aspettandosi il file nuovo senza `Ctrl+F5`.\n8. **Lasciare aperto DA DICHIARARE** e fidarsi dei costi.\n9. **Confondere spegnere con cancellare** un mondo.\n10. **Modificare un prodotto dopo l'intervista** senza leggere gli scostamenti.\n11. **Scrivere una composizione nell'unità sbagliata** — centimetri su un\n    prodotto in millimetri, o viceversa.\n12. **Chiedere l'approvazione e non avvisare nessuno** — il sistema non manda\n    notifiche: chi approva deve guardare la lista.\n\n---","tag":"approva approvazione composizione csv famiglia intervista mondo regola unità"},{"i":34,"cap":"IL COLLEGAMENTO CON IL MANUALE OPERATIVO","tit":"IL COLLEGAMENTO CON IL MANUALE OPERATIVO","txt":"Questo manuale spiega **come si usa**. Il manuale operativo dovrà spiegare\n**chi fa cosa, e quando**. I punti in cui i due si toccano:\n\n**Chi tiene la password delle regole.** Un solo responsabile. Se gira fra dieci\npersone, il pulsante non separa più niente.\n\n**Chi approva le varianti.** La meccanica c'è: richiesta, scadenza a 60 minuti,\napprova/rifiuta con motivo. Manca **la persona**: chi controlla la lista, e ogni\nquanto. Senza qualcuno che guarda, le richieste scadono e basta.\n\n**Chi mantiene l'intervista.** Le domande invecchiano. Senza revisione periodica\ndiventano un modulo da compilare in fretta scegliendo sempre la prima opzione.\n\n**Chi svuota DA DICHIARARE.** Ogni voce è una domanda a qualcuno. Se non ha un\ndestinatario, resta lì e i costi restano a zero.\n\n**Chi decide quando un prodotto nuovo entra a catalogo.** Le varianti si\naccumulano: a un certo punto una di esse è un prodotto, e va promossa.\n\n**Cosa si dice al cliente sui limiti.** La sezione 8 non è un documento interno:\nè la base di quello che si promette e di quello che non si promette.","tag":"approva cliente intervista password regole varianti"}];
function _manFiltra(q){
  q=String(q||'').toLowerCase().trim();
  if(!q) return MANUALE.slice(0,60);
  var par=q.split(/\s+/).filter(Boolean);
  return MANUALE.map(function(s){
    var testo=(s.tit+' '+s.cap+' '+s.tag+' '+s.txt).toLowerCase();
    var p=0;
    par.forEach(function(w){
      if(s.tit.toLowerCase().indexOf(w)>=0) p+=10;
      else if(s.tag.indexOf(w)>=0) p+=6;
      else if(testo.indexOf(w)>=0) p+=2;
    });
    return {s:s,p:p};
  }).filter(function(x){return x.p>0;})
    .sort(function(a,b){return b.p-a.p;})
    .map(function(x){return x.s;});
}
function _manEvidenzia(t,q){
  var h=esc(String(t||''));
  String(q||'').split(/\s+/).filter(function(w){return w.length>2;}).forEach(function(w){
    try{ h=h.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return h;
}
function _manTesto(t,q){
  /* markdown minimo: tabelle in righe, grassetto, codice */
  var h=_manEvidenzia(t,q);
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
     .replace(/`(.+?)`/g,'<code>$1</code>')
     .replace(/^\s*\|(.+)\|\s*$/gm,function(_,r){
        if(/^[\s|:-]+$/.test(r)) return '';
        return '<div class="mrow">'+r.split('|').map(function(c){return '<span>'+c.trim()+'</span>';}).join('')+'</div>';
     })
     .replace(/^\s*[-*]\s+(.+)$/gm,'<div class="mli">• $1</div>')
     .replace(/\n{2,}/g,'<br><br>');
  return h;
}
function apriApprovazioni(){
  var pan=document.getElementById('addPanel'); if(!pan)return;
  pan.classList.add('open'); document.getElementById('addOv').classList.add('open');
  function disegna(){
    var att=_inAttesa(), sca=_scadute();
    var fatte=(ANAG.approvazioni||[]).filter(function(x){return x.stato==='approvata'||x.stato==='rifiutata';})
              .sort(function(a,b){return String(b.deciso_il||'').localeCompare(String(a.deciso_il||''));}).slice(0,8);
    function riga(x,vivo){
      var t=Date.parse(x.scadenza||'')||0;
      var min=t?Math.round((t-Date.now())/60000):0;
      return '<div class="apr'+(vivo?'':' fatta')+'">'
        +'<div class="aprn">'+esc(x.variante||'')+'</div>'
        +'<div class="aprd">da <b>'+esc(x.prodotto||'')+'</b> · cliente '+esc(x.cliente||'—')
        +' · ordine '+esc(x.ordine||'—')+'</div>'
        +(vivo? '<div class="aprt">'+(min>0?('restano '+min+' minuti'):'scaduta')+'</div>' : '')
        +(vivo? '<div class="aprb"><button class="ivo ivfin" data-appok="'+esc(x.chiave)+'">approva</button>'
                +'<button class="ivo" data-appno="'+esc(x.chiave)+'">rifiuta</button></div>'
              : '<div class="aprs '+(x.stato==='approvata'?'ok':'no')+'">'+esc(x.stato)
                +(x.motivo?(' — '+esc(x.motivo)):'')+'</div>')
        +'</div>';
    }
    var h='<div class="aph"><b>Varianti da approvare</b><button id="addClose">✕</button></div><div class="apg">';
    if(!att.length && !sca.length) h+='<div class="ivh">Nessuna richiesta in attesa.</div>';
    if(att.length){ h+='<div class="mnum">'+att.length+' in attesa</div>'+att.map(function(x){return riga(x,true);}).join(''); }

/* ══════ INTERVISTA GUIDATA (09ago2026) ═══════════════════════════════════════
   Il commerciale non deve conoscere i campi: risponde a domande. Ogni domanda ha
   una condizione «se» valutata sulle risposte gia' date — nella stessa lingua
   delle regole — quindi l'intervista si RAMIFICA: chiedi la portanza solo se il
   peso e' alto, chiedi la sfoderabilita' solo se il canale e' contract.
   Alla fine le risposte popolano la configurazione del prodotto: da li' escono
   distinta, cicli, prezzo e offerta. Il lavoro che l'ufficio tecnico farebbe a
   mano e' gia' fatto, e nessuno ha compilato un campo tecnico. */
var INTERV={attiva:false, riga:null, i:0, risposte:{}, fatte:[]};

function _intervDomande(libId){
  return (ANAG.intervista||[]).filter(function(d){
    var p=String(d.prodotto||'*').trim();

function _intervScope(){

  s.EN=function(a){ if(typeof a==='number')return a;
    var m=String(a==null?'':a).replace(',','.').match(/-?[0-9]+(\.[0-9]+)?/); return m?parseFloat(m[0]):NaN; };

         if(k===cl) Object.keys(c).forEach(function(col){ var id=_nrm(col); if(s[id]===undefined)s[id]=c[col]; });
       }); }catch(e){}

/* (09ago2026) LE CONDIZIONI SI RISOLVONO SULLE RISPOSTE, non sui campi di una
   libreria. Passavo la condizione al traduttore delle regole con la lista campi
   VUOTA: nessun nome si risolveva, la condizione risultava «non capita», e la
   regola di sicurezza («nel dubbio chiedi») faceva chiedere tutto — comprese le
   domande per due persone a chi ne aveva dichiarata una.
   Qui il nome e' semplicemente la chiave di una risposta gia' data. */
function _intervVal(cond,s){
  var parti=String(cond).split(/\s+(e|o)\s+/i), esito=null, op=null;
  for(var i=0;i<parti.length;i++){
    var p=String(parti[i]).trim(); if(!p) continue;
    if(/^(e|o)$/i.test(p)){ op=p.toLowerCase(); continue; }
    var v=_intervUno(p,s);
    if(esito===null) esito=v;
    else esito = (op==='o') ? (esito||v) : (esito&&v);
  }
  return esito===null?true:esito;
}
function _intervUno(p,s){
  function val(k){ var n=_nrm(k); return (s[n]!==undefined)?s[n]:undefined; }
  function num(x){ if(typeof x==='number')return x;
    var m=String(x==null?'':x).replace(',','.').match(/-?[0-9]+(\.[0-9]+)?/); return m?parseFloat(m[0]):NaN; }
  /* confronto numerico */
  var mn=p.match(/^(.+?)\s*(>=|<=|>|<|maggiore\s+di|minore\s+di|almeno|oltre|sotto)\s*([0-9]+(?:[.,][0-9]+)?)\s*$/i);
  if(mn){
    var a=num(val(mn[1])); if(isNaN(a)) return false;
    var b=parseFloat(mn[3].replace(',','.')), o=mn[2].toLowerCase();
    if(/^(>=|almeno)$/.test(o)) return a>=b;
    if(o==='<=') return a<=b;
    if(/^(<|minore di|sotto)$/.test(o)) return a<b;
    return a>b;
  }
  /* uguaglianza / negazione — confronto parziale, come nelle regole */
  var neg=false, m=p.match(/^(.+?)\s+(non\s+è|non\s+e|diverso\s+da)\s+(.+)$/i);
  if(m) neg=true; else m=p.match(/^(.+?)\s+(è|e|uguale\s+a|:|=)\s+(.+)$/i);
  if(!m) return true;                                   /* non capita: non filtra */
  var d=val(m[1]); if(d===undefined) return false;      /* risposta non ancora data → non chiedere */
  var atteso=String(m[3]).trim().replace(/^['"]|['"]$/g,'');
  var ok=String(d).toLowerCase().indexOf(atteso.toLowerCase())>=0
      || atteso.toLowerCase().indexOf(String(d).toLowerCase())>=0;
  return neg?!ok:ok;
}
function _intervChiedibile(d){
  var cond=String(d.se||'').trim();

  try{ return _intervVal(cond,_intervScope()); }catch(e){ return true; }
}
/* ── QUALE PRODOTTO SI AVVICINA DI PIU' (09ago2026) ───────────────────────────
   Alla fine dell'intervista il sistema non sceglie: CONFRONTA. Ogni libreria
   dichiara le proprie caratteristiche in una riga di anagrafica — «molle: si,
   sfoderabile: no, sanitario: no» — e il punteggio e' un conteggio, non
   un'intelligenza. Cosi' quando sbaglia si sa perche': qualcuno ha dichiarato
   male, e si corregge una riga invece di discutere con un algoritmo.
   Le caratteristiche non dichiarate NON penalizzano: contano solo i confronti
   possibili, e le differenze si mostrano una per una. */
/* (10ago2026) SI SCRIVE IL NOME, NON L'IDENTIFICATIVO. Le librerie nate in
   Officina si chiamano «materasso_damiano_1785595515254»: un identificativo col
   timestamp, illeggibile e impossibile da scrivere a mano in una tabella. Qui il
   confronto accetta anche il TITOLO — «Materasso Damiano» — cosi' le anagrafiche
   restano leggibili da un essere umano. */
function _stessaLib(p,libId){
  if(!p||!libId) return false;
  var a=_nrm(p), b=_nrm(libId);
  if(a===b) return true;
  var L=LIB[libId];

     ma «materasso» NON deve agganciare il Damiano: quello che resta dopo il
     prefisso puo' essere SOLO il timestamp, cioe' cifre. */
  if(b.indexOf(a)===0 && b.charAt(a.length)==='_' && /^[0-9]+$/.test(b.slice(a.length+1))) return true;

function _caratteristicheLib(libId){

function _renderIntervista_(){
  var pan=document.getElementById('addPanel'); if(!pan)return;
  /* (09ago2026) il pannello si apre con la classe «open», non con display:block —
     scrivevo il contenuto in un riquadro che restava fuori schermo. */
  pan.classList.add('open'); document.getElementById('addOv').classList.add('open');
  var libId=INTERV.riga?INTERV.riga.lib:mondoAttivo;
  var D=_intervDomande(libId);
  if(!D.length){
    pan.innerHTML='<div class="aph"><b>Intervista</b><button id="addClose">✕</button></div>'
      +'<div class="apg"><div class="note" style="font-size:12.5px;line-height:1.7">Nessuna domanda definita.<br>Le domande si scrivono in <b>Anagrafica ▸ INTERVISTA</b>, una riga ciascuna, con la condizione «se» nella lingua delle regole.</div></div>';
    document.getElementById('addClose').onclick=closeAdd; return;
  }
  /* prossima domanda chiedibile */
  while(INTERV.i<D.length){
    var _dd=D[INTERV.i];
    if(!_intervChiedibile(_dd)){ INTERV.i++; continue; }
    var _gia=_giaDecisaDallaFamiglia(_dd);
    if(_gia!=null){
      /* la famiglia l'ha gia' dichiarata: la risposta e' obbligata, non si chiede */
      INTERV.risposte[_nrm(_dd.campo)]=_gia;
      INTERV.fatte.push({d:_dd.domanda, v:_gia, campo:_dd.campo, i:INTERV.i, auto:true});
      INTERV.i++; continue;
    }
    break;
  }
  var fine=(INTERV.i>=D.length);
  var pass=D.filter(function(d,j){return j<INTERV.i;}).length, tot=D.length;
  var h='<div class="aph"><b>Intervista · '+esc(libId)+'</b><button id="addClose">✕</button></div><div class="apg">';
  h+='<div class="ivp"><div class="ivb" style="width:'+Math.round(pass/tot*100)+'%"></div></div>';
  h+='<div class="ivn">'+pass+' di '+tot+' — le domande si adattano alle risposte</div>';
  /* ── LO STATO DELLA FAMIGLIA, sempre visibile ── */
  if(!INTERV.riga){
    var F=_famiglieVive(INTERV.risposte);
    if(INTERV.vicolo && INTERV.vicolo.length){
      h+='<div class="ivfam ko"><b>Nessuna famiglia regge queste risposte.</b>'
        +'<div>Serve un prodotto nuovo, oppure una di queste va cambiata:</div>'
        +INTERV.vicolo.slice(0,3).map(function(m){
           return '<div class="ivfr">'+esc(m.nome)+' — si ferma su <b>'+esc(m.contro.cosa.replace(/_/g,' '))
             +'</b>: chiesto «'+esc(m.contro.chiesto)+'», il prodotto è «'+esc(m.contro.prodotto)+'»</div>';
         }).join('')+'</div>';
    } else if(INTERV.fam){
      h+='<div class="ivfam ok">Da qui in poi siamo su <b>'
        +esc(String((LIB[INTERV.fam].voce&&(LIB[INTERV.fam].voce.nuovo||LIB[INTERV.fam].voce.mondo))||INTERV.fam))
        +'</b>'+(INTERV.famChiusaDa?('<span> — deciso da: '+esc(INTERV.famChiusaDa)+'</span>'):'')+'</div>';
    } else if(F.vive.length>1){
      h+='<div class="ivfam att">Ancora possibili: <b>'
        +F.vive.map(function(x){return esc(x.nome);}).join(' · ')+'</b>'
        +'<span> — restano '+F.vive.length+' famiglie</span></div>';
    } else if(!F.vive.length && !F.morte.length){
      /* (10ago2026) IL SILENZIO E' IL DIFETTO. Se nessuna libreria dichiara le
         proprie caratteristiche non c'e' niente da restringere — ma va DETTO,
         altrimenti sembra che l'intervista non stia ragionando. */
      h+='<div class="ivfam ko"><b>Non posso dire dove stiamo andando.</b>'
        +'<div>Nessun prodotto dichiara le proprie caratteristiche: la tabella '
        +'<b>Anagrafica ▸ CARATTERISTICHE</b> è vuota, oppure la colonna «prodotto» '
        +'non contiene gli identificativi veri delle librerie.</div></div>';
    }
  }
  /* risposte gia' date */
  if(INTERV.fatte.length){
    h+='<div class="ivstor">'+INTERV.fatte.map(function(f,j){
      return '<div class="ivsr'+(f.auto?' auto':'')+'"><span>'+esc(f.d)+'</span>'
        +(f.auto? '<b>'+esc(String(f.v))+'</b>' : '<b data-ivback="'+j+'">'+esc(String(f.v))+'</b>')+'</div>';
    }).join('')+'</div>';
  }
  if(!fine){
    var d=D[INTERV.i];
    h+='<div class="ivq">'+esc(d.domanda)+'</div>';
    if(d.nota) h+='<div class="ivh">'+esc(d.nota)+'</div>';
    var t=String(d.tipo||'testo').toLowerCase();
    if(t==='scelta'||t==='sino'){
      var opz=(t==='sino')?['sì','no']:String(d.opzioni||'').split(/[;|]/).map(function(x){return x.trim();}).filter(Boolean);
      /* (10ago2026) LE REGOLE FILTRANO MENTRE SI CHIEDE, non alla fine.
         Scoprire a domanda quindici che una configurazione non si puo' fare e'
         inutile: il commerciale l'ha gia' promessa al cliente. Ogni opzione viene
         PROVATA prima di essere offerta — si simula la configurazione con quel
         valore e si valutano le guardie del prodotto.
         L'opzione bloccata non sparisce: resta SPENTA col motivo accanto. Cosi'
         il commerciale impara il prodotto mentre lavora e sa dire al cliente
         perche' no, invece di trovarsi davanti un'opzione che non esiste. */
      var VIETATE={};
      try{
        var libP=INTERV.fam || (INTERV.riga&&INTERV.riga.lib) || null;
        if(libP && LIB[libP] && d.campo){
          var campoP=(LIB[libP].campi||[]).filter(function(x){
            return _nrm(x.id)===_nrm(d.campo)||_nrm(x.label)===_nrm(d.campo); })[0];
          if(campoP){
            var baseCfg=JSON.parse(JSON.stringify(
              (INTERV.riga&&INTERV.riga.cfg) || LIB[libP].cfgDefault || {}));
            /* le risposte gia' date entrano nella prova */
            INTERV.fatte.forEach(function(f){
              if(!f.campo)return;
              var c2=(LIB[libP].campi||[]).filter(function(x){
                return _nrm(x.id)===_nrm(f.campo)||_nrm(x.label)===_nrm(f.campo); })[0];
              if(c2) baseCfg[c2.id]=f.v;
            });
            opz.forEach(function(o){
              var prova=JSON.parse(JSON.stringify(baseCfg));
              prova[campoP.id]=o;
              var v=_guardieViolate(libP,prova);
              if(v&&v.length) VIETATE[o]=v[0];
            });
          }
        }
      }catch(eF){}
      h+='<div class="ivopz">'+opz.map(function(o){
        if(VIETATE[o]) return '<button class="ivo ivno" disabled title="'+esc(VIETATE[o])+'">'
            +esc(o)+'<i>'+esc(VIETATE[o])+'</i></button>';
        return '<button class="ivo" data-ivv="'+esc(o)+'">'+esc(o)+'</button>';
      }).join('')+'</div>';
      var nViet=Object.keys(VIETATE).length;
      if(nViet && nViet>=opz.length)
        h+='<div class="ivfam ko" style="margin-top:12px"><b>Nessuna risposta è possibile qui.</b>'
          +'<div>Una scelta precedente ha chiuso tutte le strade: torna indietro su una risposta.</div></div>';
    } else {
      h+='<div class="ivin"><input id="ivInput" type="'+(t==='numero'?'number':'text')+'" placeholder="rispondi e premi Invio"><button class="ivo" id="ivOk">avanti</button></div>';
    }
  } else if(INTERV.violazioni && INTERV.violazioni.length){
    /* ── GUARDRAIL: visibile e spiegato ─────────────────────────────────────
       Non un muro muto. Si dice cosa impedisce, e si torna indietro a cambiare
       la risposta che l'ha causato — la richiesta non si perde. */
    h+='<div class="ivq">Questa configurazione non si può produrre.</div>'
      +'<div class="ivh">Le regole del prodotto la impediscono. Non è un limite del sistema: '
      +'è un vincolo di come si costruisce il pezzo.</div>'
      +'<div class="ivdiff">'+INTERV.violazioni.map(function(v){
         return '<div class="ivdr" style="border-left-color:var(--red)"><b style="color:var(--red)">'+esc(v)+'</b></div>';
       }).join('')+'</div>'
      +'<div class="ivh">Puoi tornare su una risposta e cambiarla — le altre restano. '
      +'Se il cliente insiste, è il prodotto che va rivisto: segnalalo a chi lo governa.</div>'
      +'<div class="ivopz"><button class="ivo ivfin" id="ivIndietro">torna alle risposte</button>'
      +'<button class="ivo" id="ivChiudi2">chiudi</button></div>';
  } else {
    /* ── L'ESITO: non «ecco il prodotto», ma «ecco il piu' vicino, e cosa non torna» ── */
    var VIC=_vicinanza(INTERV.risposte);
    /* (10ago2026) se la famiglia si e' CHIUSA durante l'intervista, comanda lei.
       Il confronto resta come conferma, non come seconda opinione che contraddice. */
    var best=null;
    if(INTERV.fam) best=VIC.filter(function(v){return v.lib===INTERV.fam;})[0]||null;
    if(!best) best=VIC[0]||null;
    /* difese: una libreria generata puo' non avere voce/diff/ok */
    if(best){ best.nome=String(best.nome||best.lib||'prodotto');
              best.diff=Array.isArray(best.diff)?best.diff:[];
              best.ok=(+best.ok||0); best.su=(+best.su||0); best.pc=(+best.pc||0); }
    if(!INTERV.riga && best){
      var nomeCli='';
      try{ (ANAG.clienti||[]).forEach(function(c){
             var k=(c.codice||c.piva||c.ragione_sociale||'').toString().trim();
             if(k===(ordine.cliente||'')) nomeCli=c.ragione_sociale||k; }); }catch(e){}
      if(!nomeCli){ try{ Object.keys(LIB).forEach(function(kL){ var cc=LIB[kL]&&LIB[kL].clienti;
             if(cc&&cc[ordine.cliente]&&cc[ordine.cliente].nome) nomeCli=cc[ordine.cliente].nome; }); }catch(e){} }
      INTERV.batt=(best.nome+(nomeCli?(' · '+String(nomeCli).replace(/\s*(S\.r\.l\.|S\.p\.A\.|GmbH|SAS)\s*$/i,'').trim()):''));
      /* (11ago2026) «nessun adattamento necessario» era falso: il prodotto tace su
         cio' che non dichiara, e il silenzio non e' una coincidenza. Un prodotto
         che copre meta' delle risposte NON e' quel prodotto — e' il piu' vicino,
         che e' un'altra cosa. Qui si dice quante risposte restano scoperte. */
      var _scoperte=Math.max(0, best.su - best.ok - best.diff.length);
      var _variante=(best.diff.length>0) || (best.ok < best.su*0.7);
      h+='<div class="ivq">Fra quello che producete, il più vicino è<br><b style="color:var(--petrol)">'+esc(best.nome)+'</b></div>'
        +'<div class="ivh">'+best.ok+' risposte su '+best.su+' coincidono.'
        +(best.diff.length? ' '+best.diff.length+(best.diff.length===1?' va adattata:':' vanno adattate:') : '')
        +(_scoperte? ' Su '+_scoperte+(_scoperte===1?' il prodotto non si pronuncia.':' il prodotto non si pronuncia.') : '')
        +'</div>';
      if(best.diff.length){
        h+='<div class="ivdiff">'+best.diff.map(function(d){
          return '<div class="ivdr"><span>'+esc(String(d.cosa||'').replace(/_/g,' '))+'</span>'
            +'<b>chiesto: '+esc(d.chiesto)+'</b><i>oggi: '+esc(d.prodotto)+'</i></div>';
        }).join('')+'</div>';
      }
      if(VIC.length>1){
        h+='<div class="ivalt">altri: '+VIC.slice(1,4).map(function(v){
          return '<button class="ivo ivsm" data-ivlib="'+esc(v.lib)+'">'+esc(v.nome)+' · '+v.pc+'%</button>';
        }).join('')+'</div>';
      }
      if(_variante){
        h+='<div class="ivfam ko" style="background:#F6F1FA;border-left-color:#7A5AA0;color:#5B3E7A">'
          +'<b>Non è un '+esc(best.nome)+' standard.</b>'
          +'<div>Nessuna regola lo impedisce, ma copre solo '+best.ok+' delle '+best.su+' risposte: '
          +'nasce come <b>variante da approvare</b>, non come prodotto a catalogo.</div></div>';
      }
      h+='<div class="ivnome"><label>Come si chiamerà questo modello</label>'
        +'<input id="ivBatt" type="text" value="'+esc(INTERV.batt)+'"></div>'
        +'<div class="ivopz"><button class="ivo '+(_variante?'ivvar':'ivfin')+'" id="ivApplica" data-ivlib="'+esc(best.lib)+'"'
        +(_variante?' data-ivvar="1"':'')+'>'+(_variante?'◈ crea la variante da approvare':'crea il modello')+'</button></div>';
    } else if(!INTERV.riga && !best){
      /* (10ago2026) VIA D'USCITA SEMPRE. Se nessuna famiglia regge le risposte —
         o se nessun prodotto dichiara le proprie caratteristiche — prima l'utente
         restava bloccato: quindici risposte in mano e nessun modo di farne un
         prodotto. Ora sceglie lui, e le risposte non si buttano. */
      var TUTTE=Object.keys(LIB).map(function(k){
        return {lib:k, nome:String((LIB[k].voce&&(LIB[k].voce.nuovo||LIB[k].voce.mondo))||k)};
      });
      var vic=INTERV.vicolo&&INTERV.vicolo.length?INTERV.vicolo:null;
      h+='<div class="ivq">Nessuno dei prodotti esistenti regge queste risposte.</div>';
      if(vic){
        h+='<div class="ivh">Ecco dove si fermano — serve un prodotto nuovo, oppure una risposta va cambiata:</div>'
          +'<div class="ivdiff">'+vic.slice(0,4).map(function(m){
             return '<div class="ivdr"><span>'+esc(m.nome)+'</span>'
               +'<b>chiesto: '+esc(m.contro.chiesto)+'</b><i>il prodotto è: '+esc(m.contro.prodotto)+'</i></div>';
           }).join('')+'</div>';
      } else {
        h+='<div class="ivh">Nessun prodotto dichiara le proprie caratteristiche: si compila '
          +'<b>Anagrafica ▸ CARATTERISTICHE</b>, una riga per prodotto.</div>';
      }
      h+='<div class="ivh">Le risposte restano comunque: scegli su quale linea costruirlo e diventano la sua configurazione.</div>'
        +'<div class="ivalt">'+TUTTE.slice(0,8).map(function(v){
           return '<button class="ivo ivsm" data-ivpick="'+esc(v.lib)+'">'+esc(v.nome)+'</button>';
         }).join('')+'</div>'
        +'<div class="ivnome"><label>Come si chiamerà questo modello</label>'
        +'<input id="ivBatt" type="text" value="'+esc((ordine.numero||'MODELLO')+' · su misura')+'"></div>'
        +'<div class="ivopz"><button class="ivo ivfin" id="ivApplica" data-ivlib="">crea il modello</button>'
        +'<button class="ivo" id="ivChiudi">chiudi senza creare</button></div>';
    } else {
      h+='<div class="ivq">Intervista completata.</div>'
        +'<div class="ivh">Le risposte diventano la configurazione del prodotto: distinta, cicli e prezzo si calcolano da qui.</div>'
        +'<div class="ivopz"><button class="ivo ivfin" id="ivApplica">applica al prodotto</button></div>';
    }
  }
  h+='</div>';
  pan.innerHTML=h;
  document.getElementById('addClose').onclick=closeAdd;
  document.getElementById('addOv').onclick=closeAdd;
  function rispondi(v){
    var d=D[INTERV.i];
    INTERV.risposte[_nrm(d.campo||d.domanda)]=v;
    if(d.campo) INTERV.risposte[_nrm(d.campo)]=v;
    INTERV.fatte.push({d:d.domanda, v:v, campo:d.campo, i:INTERV.i});
    INTERV.i++;
    /* ── la famiglia si restringe qui, non alla fine ── */
    if(!INTERV.riga){
      var F=_famiglieVive(INTERV.risposte);
      INTERV.vicolo = (F.vive.length===0) ? F.morte : null;
      if(F.vive.length===1 && !INTERV.fam){
        INTERV.fam=F.vive[0].lib; INTERV.famChiusaDa=d.domanda;
      } else if(F.vive.length>1 && INTERV.fam){
        /* una risposta ha riaperto il campo: la famiglia non e' piu' certa */
        if(!F.vive.some(function(x){return x.lib===INTERV.fam;})) INTERV.fam=null;
      }
    }
    renderIntervista();
  }
  pan.querySelectorAll('[data-ivv]').forEach(function(b){ b.onclick=function(){ rispondi(b.getAttribute('data-ivv')); }; });
  var inp=document.getElementById('ivInput');
  if(inp){ inp.focus();
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&inp.value.trim()) rispondi(inp.value.trim()); });
    document.getElementById('ivOk').onclick=function(){ if(inp.value.trim()) rispondi(inp.value.trim()); }; }
  pan.querySelectorAll('[data-ivback]').forEach(function(b){ b.onclick=function(){
    var j=+b.getAttribute('data-ivback');
    INTERV.i=INTERV.fatte[j].i; INTERV.fatte=INTERV.fatte.slice(0,j);
    INTERV.risposte={}; INTERV.fatte.forEach(function(f){ INTERV.risposte[_nrm(f.campo||f.d)]=f.v; });
    renderIntervista();
  };});
  pan.querySelectorAll('[data-ivpick]').forEach(function(b){
    b.onclick=function(){
      var ap2=document.getElementById('ivApplica');
      if(!ap2)return;
      ap2.setAttribute('data-ivlib', b.getAttribute('data-ivpick'));
      pan.querySelectorAll('[data-ivpick]').forEach(function(x){
        x.style.borderColor=''; x.style.background=''; x.style.color=''; });
      b.style.borderColor='var(--petrol)'; b.style.background='var(--petrol-soft)'; b.style.color='var(--petrol)';
      ap2.textContent='crea il modello · '+b.textContent;
    };
  });
  var _bch=document.getElementById('ivChiudi'); if(_bch)_bch.onclick=closeAdd;
  var _bc2=document.getElementById('ivChiudi2'); if(_bc2)_bc2.onclick=closeAdd;
  var _bin=document.getElementById('ivIndietro');
  if(_bin)_bin.onclick=function(){
    /* si torna all'ultima risposta data: quella si può cambiare, le altre restano */
    INTERV.violazioni=null;
    if(INTERV.fatte.length){
      var ult=INTERV.fatte[INTERV.fatte.length-1];
      INTERV.i=ult.i; INTERV.fatte=INTERV.fatte.slice(0,-1);
      INTERV.risposte={}; INTERV.fatte.forEach(function(f){ INTERV.risposte[_nrm(f.campo||f.d)]=f.v; });
      INTERV.fam=null; INTERV.famChiusaDa=null; INTERV.vicolo=null;
    }
    renderIntervista();
  };
  pan.querySelectorAll('[data-ivlib]').forEach(function(b){
    if(b.id==='ivApplica')return;
    b.onclick=function(){
      var ap2=document.getElementById('ivApplica');
      if(ap2){ ap2.setAttribute('data-ivlib', b.getAttribute('data-ivlib')); ap2.click(); }
    };
  });
  var ap=document.getElementById('ivApplica');
  /* (10ago2026) L'ERRORE SI VEDE. Fin qui un'eccezione qui dentro chiudeva il
     pannello e non produceva niente: «non succede nulla» era indistinguibile da
     «ha fallito». Ora il guasto si dichiara, con il punto in cui e' avvenuto. */
  if(ap)ap.onclick=function(){
   try{
    var r=INTERV.riga, _creataOra=false;
    if(!r){
      var libScelta=ap.getAttribute('data-ivlib');
      if(!libScelta){ _avviso('Scegli prima su quale linea costruirlo.'); return; }
      if(ORDINE_CONGELATO){ avvisoCongelato(); return; }
      ordine.righe.push({lib:libScelta, cfg:JSON.parse(JSON.stringify(LIB[libScelta].cfgDefault||{})), qta:1});
      rigaAttiva=ordine.righe.length-1;
      r=ordine.righe[rigaAttiva];
      var bt=document.getElementById('ivBatt');
      if(bt&&bt.value.trim()) r.titolo=bt.value.trim();
      /* (11ago2026) se il prodotto non copre le risposte, nasce VARIANTE:
         nessuna regola lo impedisce, ma non e' il prodotto a catalogo. */
      if(ap.getAttribute('data-ivvar')==='1'){
        r.variante={nome:(r.titolo||_nomeVariante(r)), da:libScelta, cliente:(ordine.cliente||''),
                    data:new Date().toISOString().slice(0,10), stato:'da approvare',
                    origine:'intervista'};
      }
    }
    /* (10ago2026) IL CAMBIO LIBRERIA VALE SEMPRE, anche quando l'intervista parte
       da un prodotto gia' aperto. Prima valeva solo partendo da zero: la risposta
       «Materasso Damiano» veniva segnata come applicata e non faceva niente —
       la peggiore delle combinazioni, perche' mentiva.
       (09ago2026) UNA RISPOSTA PUO' SCEGLIERE IL PRODOTTO, non solo compilarlo.
       Se una domanda ha campo = «prodotto», la sua risposta dice QUALE libreria
       aprire: «molle insacchettate» porta a un materasso, «schiuma arrotolabile»
       a un altro. L'intervista smette di riempire un prodotto gia' scelto e
       comincia a sceglierlo. Il confronto e' sul nome della libreria o sul suo
       titolo, cosi' in tabella si scrive in italiano. */
    var _cambiata=false;
    var scelta=INTERV.fatte.filter(function(f){return _nrm(f.campo)==='prodotto';})[0];
    if(scelta){
      /* (10ago2026) PRIMA L'ESATTA, POI LA PARZIALE. Il confronto parziale da solo
         faceva vincere «materasso» su «materasso damiano», perche' il primo e'
         contenuto nel secondo ed e' anche il primo dell'elenco: chiedevi il
         Damiano e ottenevi sempre il Materasso. Fra le parziali vince la piu'
         LUNGA, che e' la piu' specifica. */
      var cerca=_nrm(scelta.v), trovata=null, cand=[];
      Object.keys(LIB).forEach(function(k){
        var L=LIB[k], tit=_nrm(String((L.voce&&(L.voce.nuovo||L.voce.mondo))||k));
        if(_nrm(k)===cerca || tit===cerca){ trovata=k; return; }
        if(tit && (tit.indexOf(cerca)>=0 || cerca.indexOf(tit)>=0)) cand.push({k:k,len:tit.length});
      });
      if(!trovata && cand.length){
        cand.sort(function(a,b){return b.len-a.len;});
        trovata=cand[0].k;
      }
      if(trovata && trovata!==r.lib){
        r.lib=trovata;
        r.cfg=JSON.parse(JSON.stringify(LIB[trovata].cfgDefault||{}));
        _cambiata=true;
      } else if(trovata){ _cambiata=true; }
      scelta._ok=_cambiata;
    }
    /* (09ago2026) LE RISPOSTE RESTANO. Prima vivevano solo durante la conversazione:
       si riversavano nei campi e sparivano. Ma la configurazione la ricostruisci
       guardando il prodotto — il PERCHE' no. Fra sei mesi «perche' 832 molle?» non
       aveva risposta. Ora le risposte si attaccano alla riga, si vedono nella
       scheda e viaggiano verso l'ERP.
       E quando una risposta non trova un campo dove andare, lo DICE invece di
       cadere in silenzio. */
    r.intervista=[];
    INTERV.fatte.forEach(function(f){
      var rec={domanda:f.d, risposta:f.v, campo:(f.campo||''), applicata:false};
      if(f.campo && _nrm(f.campo)!=='prodotto'){
        var lib=LIB[r.lib], c=(lib.campi||[]).filter(function(x){return _nrm(x.id)===_nrm(f.campo)||_nrm(x.label)===_nrm(f.campo);})[0];
        if(c){ r.cfg[c.id]=f.v; rec.applicata=true; }
      } else if(_nrm(f.campo)==='prodotto'){
        /* «applicata» solo se la libreria e' stata davvero trovata */
        rec.applicata=!!(scelta&&scelta._ok);
      }
      r.intervista.push(rec);
    });
    /* ── LA COMPOSIZIONE: dalle risposte alla struttura ── */
    /* (10ago2026) la composizione DICHIARA il proprio esito. Senza, quando non
       reagisce non si distingue da «non esiste»: si guarda la stratigrafia e si
       indovina. Qui resta scritto cosa e' stato usato e cosa ha vinto. */
    var _chiavi=Object.keys(INTERV.risposte||{}).filter(function(k){return k&&k!=='EQ'&&k!=='EN';})
                 .map(function(k){return k+'='+INTERV.risposte[k];}).join(' · ');
    var _nreg=(ANAG.composizione||[]).filter(function(x){
      var p=String(x.prodotto||'*').trim(); return !p||p==='*'||_nrm(p)===_nrm(r.lib); }).length;
    var comp=_componiDaRisposte(r.lib, INTERV.risposte);
    if(!comp){
      r.intervista.push({domanda:'— composizione', applicata:false,
        campo:'composizione',
        risposta:(_nreg? ('nessuna delle '+_nreg+' regole ha reagito') : ('nessuna regola per «'+r.lib+'»'))});
      r.intervista.push({domanda:'— risposte viste dal motore', applicata:false,
        campo:'composizione', risposta:(_chiavi||'nessuna')});
    }
    if(comp){
      if(comp.strati && comp.strati.length) r.cfg.strati=comp.strati;
      if(comp.campi) Object.keys(comp.campi).forEach(function(k){
        var c=(LIB[r.lib].campi||[]).filter(function(x){return _nrm(x.id)===_nrm(k)||_nrm(x.label)===_nrm(k);})[0];
        if(c) r.cfg[c.id]=comp.campi[k];
      });
      r.intervista.push({domanda:'— composizione applicata', applicata:true, campo:'composizione',
                         risposta:((comp.nota||'regola')+(comp.se?('  ['+comp.se+']'):''))});
    }
    closeAdd(); renderAll();
   }catch(errIV){
     var msg='Creazione modello non riuscita: '+(errIV&&errIV.message?errIV.message:errIV);
     try{ _avviso(msg); }catch(e){ alert(msg); }
     console.error('[intervista]',errIV);
   }
  };
}

function richiamaOrdine(numero){
  /* (04ago2026) Prima un solo .catch() copriva TUTTO: rete, risposta del server e
     apertura dell'ordine. Qualunque cosa andasse storta diceva "Server non
     raggiungibile", che è la diagnosi sbagliata nove volte su dieci. Ora i tre
     momenti sono separati e ognuno dice la sua verità. */
  fetch('/api/offerte/'+encodeURIComponent(numero))
    .then(function(r){
      if(r.status===404) throw {tipo:'nontrovato'};
      if(!r.ok) throw {tipo:'server', dett:'HTTP '+r.status};
      return r.json();
    })
    .then(function(d){
      if(!d || !d.payload) throw {tipo:'vuoto'};
      try{
        var p=d.payload;
        /* (04ago2026) Gli ordini registrati prima d'ora non hanno `lib` e `cfg`:
           li ricostruisco da quello che c'e' (la firma porta il nome della libreria,
           le varianti portano i valori dei campi). Cosi' si riaprono anche i vecchi. */
        var righe=(p.righe||[]).map(function(rp){
          if(rp && rp.lib && rp.cfg) return rp;                  /* ordine nuovo: gia' completo */
          var lib=rp.lib||null;
          if(!lib && rp.firma && rp.firma.testo) lib=String(rp.firma.testo).split('::')[0]||null;
          if(!lib && rp.articolo_padre){
            Object.keys(LIB).forEach(function(k){
              if(!lib && LIB[k].codice && LIB[k].codice.padre===rp.articolo_padre) lib=k;
            });
          }
          var cfg=rp.cfg||null;
          if(!cfg){
            cfg={};
            (rp.varianti||[]).forEach(function(v){ if(v&&v.campo!=null&&v.valore!=null) cfg[v.campo]=v.valore; });
            if(rp.misura!=null && cfg.misura==null) cfg.misura=rp.misura;
            if(Array.isArray(rp.strati)) cfg.strati=rp.strati;
            /* (04ago2026) GLI STRATI STANNO NELLA FIRMA.
               Il payload salvato prima d'oggi non conserva la lista strati: le
               `varianti` contengono solo i campi dichiarati. Ma la firma li porta
               tutti, uno per uno — `strati1={col:rosso;h:30;mat:...}` — perche' e'
               nata apposta per descrivere la composizione intera. Li rileggo da li'.
               Senza questo, un ordine richiamato tornava senza strati: lista vuota
               e modello tutto di un colore. */
            var _t=(rp.firma&&rp.firma.testo)? String(rp.firma.testo) : '';
            var _corpo=_t.indexOf('::')>=0 ? _t.slice(_t.indexOf('::')+2) : '';
            if(_corpo){
              var _arr={};
              _corpo.split('|').forEach(function(tok){
                var e=tok.indexOf('='); if(e<0) return;
                var k=tok.slice(0,e), v=tok.slice(e+1);
                if(/^n_/.test(k) || /_h_tot$/.test(k)) return;          /* valori derivati */
                var m=k.match(/^(.+?)(\d+)$/);
                if(m && v.charAt(0)==='{'){                              /* voce di un elenco */
                  var nome=m[1], pos=parseInt(m[2],10)-1, o={};
                  v.replace(/^\{|\}$/g,'').split(';').forEach(function(cp){
                    var c=cp.indexOf(':'); if(c<0) return;
                    var kk=cp.slice(0,c), vv=cp.slice(c+1);
                    o[kk]=(kk==='h' && vv!=='' && !isNaN(vv))? parseFloat(vv) : vv;
                  });
                  (_arr[nome]=_arr[nome]||[])[pos]=o;
                } else if(cfg[k]===undefined){
                  cfg[k]=v;
                }
              });
              Object.keys(_arr).forEach(function(nome){
                var lista=_arr[nome].filter(function(x){return !!x;});
                if(lista.length && !Array.isArray(cfg[nome])) cfg[nome]=lista;
              });
              /* (06ago2026) IL NOME DELLO STRATO NON STA NELLA FIRMA, ED E' GIUSTO COSI':
                 la firma descrive il PRODOTTO, e un'etichetta scritta a mano non lo cambia
                 — due materassi identici con nomi di strato diversi devono restare lo
                 stesso prodotto, altrimenti il riconoscimento non aggancerebbe piu' nulla.
                 Ma una lista con la prima colonna vuota sembra rotta. Negli ordini vecchi
                 (senza cfg salvata) riempio le caselle di testo con il colore o il
                 materiale dello strato: si legge, e non inventa caratteristiche. */
              try{
                var _lb=LIB[lib];
                ((_lb&&_lb.elementi)||[]).forEach(function(el){
                  var lista=cfg[el.id]; if(!Array.isArray(lista)) return;
                  var testi=(el.sub||[]).filter(function(sb){ return (sb.tipo||'testo')==='testo'; });
                  if(!testi.length) return;
                  lista.forEach(function(it,ix){
                    testi.forEach(function(sb){
                      if(it[sb.id]===undefined || it[sb.id]===''){
                        var etichetta=it.col || it.mat || (el.id+' '+(ix+1));
                        it[sb.id]=String(etichetta).charAt(0).toUpperCase()+String(etichetta).slice(1);
                      }
                    });
                  });
                });
              }catch(e){}
            }
          }
          return {lib:lib, cfg:cfg, qta:(rp.quantita!=null?rp.quantita:(rp.qta!=null?rp.qta:1))};
        });
        /* ora controllo che ogni riga sappia a quale prodotto appartiene */
        var manca=null, senzaLib=false;
        righe.forEach(function(r){
          if(!r || !r.lib){ senzaLib=true; return; }
          if(!LIB[r.lib] && !manca) manca=r.lib;
        });
        if(senzaLib) throw {tipo:'incompleto'};
        if(manca) throw {tipo:'mondo', dett:manca};
        if(p.mondo && GRUPPI.find(function(g){return g.id===p.mondo;})){
          mondoCorrente=p.mondo;
          mondoAttivo=GRUPPI.find(function(g){return g.id===p.mondo;}).primary;
        }
        ordine={numero:d.numero, data:p.data||d.data, cliente:p.cliente||d.cliente_cod, righe:righe};
        ORDINE_STATO=d.stato; ORDINE_CONGELATO=!!d.congelato;
        rigaAttiva = righe.length? 0 : null;
        closeAdd(); boot();
        _avviso('Ordine '+d.numero+' richiamato: '+righe.length+' riga/e.');
        if(ORDINE_CONGELATO) setTimeout(function(){
          _avviso('Ordine '+d.numero+' è CONGELATO (preso dall\'ERP): sola lettura.');},400);
      }catch(err){
        if(err && err.tipo) throw err;
        throw {tipo:'apertura', dett:(err && err.message)? err.message : String(err)};
      }
    })
    .catch(function(e){
      var t=(e&&e.tipo)||'rete';
      if(t==='nontrovato')      _avviso('Ordine '+numero+' non trovato sul server.');
      else if(t==='vuoto')      _avviso('Ordine '+numero+': il server lo trova ma è senza contenuto.');
      else if(t==='mondo')      _avviso('Ordine '+numero+': il prodotto "'+e.dett+'" non è fra i mondi caricati in questo ambiente.');
      else if(t==='incompleto') _avviso('Ordine '+numero+': registrato prima di questa versione, non dice a quale prodotto appartiene. Gli ordini nuovi si riaprono.');
      else if(t==='server')     _avviso('Il server ha risposto con un errore ('+e.dett+').');
      else if(t==='apertura')   _avviso('Ordine letto, ma non si apre: '+e.dett);
      else                      _avviso('Server non raggiungibile.');
      console.warn('[richiamaOrdine]', numero, e);
    });
}

     Prima si partiva da LIB[mondoAttivo].clienti: un mondo nato in Officina
     riceveva il segnaposto CLIENTI_NEUTRO e restava senza clienti veri, per

     altrimenti l'unione dei clienti di TUTTE le librerie caricate.

  var cli={}, _reali=0;

  var dashHtml='<div class="k big"><div class="l">'+esc(lib.voce.prezzoRiga)+'</div><div class="v">'+dashPrezzo(r,C)+'</div></div>'+

                 : '');
          })()
        : (r.intervista&&r.intervista.length)

             }).join('')

function prezzoRiga(r,C){

/* ══ RICONOSCIMENTO INCREMENTALE — il pannellino "gia' fatto" ══════════
   A ogni modifica interroga il server con le scelte fatte finora e mostra
   quanti prodotti simili esistono, per il cliente e in azienda. Debounced:
   non chiama a raffica. Se offline, il pannello si nasconde e non disturba. */
var _ricoTimer=null;
function _aggiornaRiconoscimento(){
  var box=document.getElementById('ricoBox'); if(!box) return;
  var r=(rigaAttiva!=null)?ordine.righe[rigaAttiva]:null;
  if(!r){ box.style.display='none'; return; }
  clearTimeout(_ricoTimer);
  _ricoTimer=setTimeout(function(){
    if(typeof riconosciProgressivo!=='function'){ box.style.display='none'; return; }
    riconosciProgressivo(r, ordine.cliente||'', function(res){
      if(!res){ box.style.display='none'; return; }   /* offline: taccio, non mento */
      if(!res.quanti){
        /* ── (03ago2026) IL TERZO STATO, prima invisibile.
           Il pannello compariva solo quando c'era un precedente: "mai fatto" e
           "riconoscimento non funziona" erano indistinguibili a schermo.
           Ora il ciclo si vede tutto: MAI FATTO (invenzione) → GIA' FATTO (noto). */
        box.style.display='block';
        box.innerHTML='<div style="font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:#0E6B66;'+
          'font-weight:700;text-transform:uppercase;margin-bottom:4px">Mai fatto — prima volta</div>'+
          '<div style="font-size:13px;color:#1A1A1A">Questa composizione non risulta n'+"\u00e9"+
          ' a <b>'+esc(ordine.cliente||'questo cliente')+'</b> n'+"\u00e9"+' ad altri clienti.</div>';
        return;
      }
      box.style.display='block';
      var esatto = res.esatto;
      var pc=res.per_cliente||0, pa=res.per_altri||0;
      var testa = esatto ? 'GIÀ FATTO — identico' : 'Simile a qualcosa che avete già fatto';
      var righe=[];
      if(pc>0) righe.push('<b>'+pc+'</b> volt'+(pc===1?'a':'e')+' per <b>questo cliente</b>');
      if(pa>0) righe.push('<b>'+pa+'</b> in azienda (altri clienti)');
      var esempi=(res.esempi_cliente||[]).concat(res.esempi_altri||[]).slice(0,4).map(function(e){
        /* riga CLICCABILE: al click richiama quell'ordine e lo riapre per riutilizzarlo */
        return '<div class="rico-riga" data-ord="'+esc(e.numero||'')+'" '
          +'style="font-size:12px;color:#5a4a2a;margin-top:4px;padding:5px 8px;background:#fff;border:1px solid #EBD9A8;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center" '
          +'title="Clicca per riaprire e riutilizzare questo ordine">'
          +'<span><b>'+esc(e.numero||'')+'</b> · '+esc(e.cliente||'—')+' · '+(e.data||'')+'</span>'
          +'<span style="font-family:var(--mono);color:#0E6B66">€'+(e.prezzo!=null?e.prezzo:'—')+(e.esatto?' <span style="color:#E8730C">esatto</span>':'')
          +' <b class="rico-rip" data-rip="'+esc(e.numero||'')+'" title="riparti da questa configurazione, tenendo il cliente di adesso" style="margin-left:8px;padding:2px 8px;border:1px solid #E8730C;border-radius:3px;color:#E8730C;cursor:pointer;font-weight:500">riparti</b>'
          +' ↗</span>'
          +'</div>';
      }).join('');
      box.innerHTML='<div style="font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:'+(esatto?'#E8730C':'#8A6D1A')+';font-weight:700;text-transform:uppercase;margin-bottom:4px">'+testa+'</div>'
        +'<div style="font-size:13px;color:#1A1A1A">'+righe.join(' · ')+'</div>'+esempi;
      /* rendo cliccabili le righe: al click riapro quell'ordine */
      box.querySelectorAll('.rico-riga').forEach(function(rr){
        rr.onclick=function(){ var n=rr.getAttribute('data-ord'); if(n){ closeAdd&&closeAdd(); richiamaOrdine(n); } };
      });
      /* ── (09ago2026) RIPARTI DA QUI ─────────────────────────────────────────
         Cliccare la riga riapre l'ORDINE intero: cliente compreso, e si perde
         quello su cui stai lavorando. Ma il valore della sartoria non e' nella
         prima volta: e' nella ventesima. «riparti» prende SOLO la configurazione
         di quel pezzo — strati, materiali, colori, zone — e la porta qui,
         lasciando il cliente e l'ordine di adesso. Le regole e i listini di
         QUESTO cliente si riapplicano da soli: stessa sartoria, prezzo suo. */
      box.querySelectorAll('.rico-rip').forEach(function(bt){
        bt.onclick=function(ev){
          ev.stopPropagation();
          var n=bt.getAttribute('data-rip'); if(!n)return;
          fetch('/api/offerte/'+encodeURIComponent(n))
            .then(function(x){ if(!x.ok) throw 0; return x.json(); })
            .then(function(d){
              var p=d&&d.payload; if(!p||!p.righe||!p.righe.length) throw 0;
              var cur=ordine.righe[rigaAttiva]; if(!cur) throw 0;
              /* prendo la riga della STESSA libreria, altrimenti la prima */
              var src=p.righe.filter(function(x){return x.lib===cur.lib;})[0]||p.righe[0];
              if(!src||!src.cfg) throw 0;
              cur.cfg=JSON.parse(JSON.stringify(src.cfg));
              _avviso('Ripartito da '+n+' — configurazione copiata, cliente e listino restano quelli di adesso.');
              renderAll();
            })
            .catch(function(){ _avviso('Non sono riuscito a recuperare la configurazione di '+n+'.'); });
        };
      });
    });
  }, 250);
}

function outlinePointsFor(cfg){var P=[];if(cfg.shape==='RETT'){var L=cfg.rett.L,W=cfg.rett.P,R=Math.min(cfg.rett.R,L/2,W/2),seg=8,hx=L/2,hy=W/2;var arc=function(cx,cy,a0,a1){for(var i=0;i<=seg;i++){var a=a0+(a1-a0)*i/seg;P.push({x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)});}};if(R>0){arc(hx-R,hy-R,0,Math.PI/2);arc(-hx+R,hy-R,Math.PI/2,Math.PI);arc(-hx+R,-hy+R,Math.PI,1.5*Math.PI);arc(hx-R,-hy+R,1.5*Math.PI,2*Math.PI);}else{P.push({x:hx,y:hy},{x:-hx,y:hy},{x:-hx,y:-hy},{x:hx,y:-hy});}}else if(cfg.shape==='POLY'){var n=cfg.poly.n,R2=cfg.poly.d/2,r0=(cfg.poly.rot||0)*Math.PI/180;for(var i=0;i<n;i++){var a=r0+2*Math.PI*i/n-Math.PI/2;P.push({x:R2*Math.cos(a),y:R2*Math.sin(a)});}}else{var a2=cfg.ell.a,b2=cfg.ell.b,s2=48;for(var i=0;i<s2;i++){var t=2*Math.PI*i/s2;P.push({x:a2/2*Math.cos(t),y:b2/2*Math.sin(t)});}}return P;}
function areaPoly(pts){var a=0;for(var i=0;i<pts.length;i++){var j=(i+1)%pts.length;a+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}return Math.abs(a/2);}
function perimPoly(pts){var p=0;for(var i=0;i<pts.length;i++){var j=(i+1)%pts.length;p+=Math.hypot(pts[j].x-pts[i].x,pts[j].y-pts[i].y);}return p;}
function bboxOf(pts){var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;pts.forEach(function(p){mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mny=Math.min(mny,p.y);mxy=Math.max(mxy,p.y);});return {minx:mnx,maxx:mxx,miny:mny,maxy:mxy};}

/* ── ZONE DI LAVORAZIONE (08ago2026) ──────────────────────────────────────────
   Uno strato non e' sempre uniforme. Nel materasso Osiris la stessa lastra ha
   zig-zag nelle fasce spalle e piedi, e due inserti al centro: stesso materiale,
   lavorazioni diverse lungo la lunghezza. E' quella zonizzazione a dare le zone
   di portanza — cioe' E' il prodotto, non una decorazione.

   DUE NATURE DIVERSE, e vanno tenute separate (lezione dei colori dedotti):

   · POSIZIONE in PERCENTUALE della lunghezza — la zona segue il CORPO. La zona
     lombare sta a meta' del materasso, che sia da 190 o da 200. Le fasce sono
     anatomiche, e un corpo non si allunga col materasso.

   · DIMENSIONE in MILLIMETRI ASSOLUTI — la decide l'ATTREZZATURA, non il pezzo.
     L'inserto Osiris e' 12x4,5 cm perche' cosi' lo taglia la macchina: dal blocco
     204x105 ne escono 15x20=300 con 6 mm di sfrido. Se la dimensione scalasse,
     su un materasso da 210 la distinta direbbe 12,6x4,7 — e in reparto
     taglierebbero comunque 12x4,5, perche' e' l'unico che sanno fare. Distinta
     sbagliata, e nessuno se ne accorge fino alla produzione.

   Questo primo passo dichiara SOLO il dato: le zone si scrivono, si salvano, le
   regole possono leggerle. Il disegno e la distinta vengono dopo, separatamente. */
function zoneElemento(){
  return {id:'zone',
    voce:{titolo:'Zone — da/a in % (scalano) · lx,ly in mm (non scalano) · mat+resa = pezzi in distinta · min+reparto = ciclo',
          add:'+ aggiungi zona'},
    sub:[
      {id:'nome', tipo:'testo'},                                    /* spalle · lombare · piedi */
      {id:'da',   tipo:'num'},                                      /* % dalla testa — scala */
      {id:'a',    tipo:'num'},                                      /* % dalla testa — scala */
      {id:'lav',  tipo:'scelta', opz:[
        {v:'zigzag',  label:'zig-zag'},
        {v:'inserto', label:'inserto'},
        {v:'bugna',   label:'bugnatura'},
        {v:'scavo',   label:'scavatura'},
        {v:'foro',    label:'foratura'},
        {v:'piena',   label:'nessuna (piena)'}]},
      {id:'lx',   tipo:'num'},                                      /* mm assoluti — NON scala */
      {id:'ly',   tipo:'num'},                                      /* mm assoluti — NON scala */
      {id:'n',    tipo:'num'},                                      /* quanti pezzi nella zona */
      /* (09ago2026) LA ZONA PORTA CIO' CHE SERVE A COSTARLA.
         · mat + resa → se la zona e' fatta di PEZZI (inserti alloggiati), genera
           righe di distinta con la stessa formula del blocco: resa = quanti ne
           escono da un cubotto.
         · min + reparto → i minuti di lavorazione. E' il posto dove entra il
           numero della simulazione DXF, che oggi vive in una nota di testo.
         Se mat e' vuoto la zona e' SOLO lavorazione: non genera componenti.
         Non si deduce: si dichiara. */
      {id:'mat',     tipo:'testo'},
      {id:'resa',    tipo:'num'},
      {id:'min',     tipo:'num'},
      {id:'reparto', tipo:'testo'}
    ],
    def:{nome:'zona', da:40, a:60, lav:'inserto', lx:120, ly:45, n:2,
         mat:'', resa:0, min:0, reparto:'Sagomatrice'}};
}

function disegnoStrati(cfg,W,P){var parti=cfg.strati.map(function(st){var mat=MATERIALI[st.mat];var col=(COLORI[st.col]&&COLORI[st.col].hex)?COLORI[st.col].hex:mat.col;return {nome:mat.nome+' · '+COLORI[st.col].nome,colore:col,spessore:Math.max(22,st.h*10)};});return {vista:'strati',W:W,P:P,parti:parti};}

/* ── 3D DELLA STRATIGRAFIA — gli strati SONO i mattoni, nessun GLB serve.
   Stessa sorgente colore del 2D: gli STRATI veri (cfg.strati), MAI i campi colore_*.
   Le proporzioni sono reali; la scala d'insieme si adatta all'inquadratura come nel 2D. */
function _hexInt(h){if(typeof h==='number')return h;var n=parseInt(String(h||'').replace('#',''),16);return isNaN(n)?0x8AA9A6:n;}
/* (05ago2026) IL PRESSATO: forma + strati + fori, tutto generato dai numeri.
   Nessun GLB da importare: il pezzo non esiste finche' non lo componi. */
function distinta3dPressato(cfg,campi){
  var F=(typeof _formaCfg==='function')? _formaCfg(cfg,campi) : null;
  var pts=(typeof outlinePointsFor==='function' && F)? outlinePointsFor(F) : null;
  if(!pts || pts.length<3) return null;
  /* outlinePointsFor restituisce punti come {x,y}, non come coppie: li normalizzo qui */
  var xs=pts.map(function(q){return q.x;}), ys=pts.map(function(q){return q.y;});
  var W=Math.max.apply(null,xs)-Math.min.apply(null,xs);
  var D=Math.max.apply(null,ys)-Math.min.apply(null,ys);
  var cx=(Math.max.apply(null,xs)+Math.min.apply(null,xs))/2;
  var cy=(Math.max.apply(null,ys)+Math.min.apply(null,ys))/2;
  var k=1.6/Math.max(W,D,1);          /* il lato maggiore sta in 1,6 unita' di scena */
  var P=pts.map(function(q){ return [(q.x-cx)*k, (q.y-cy)*k]; });
  var fori=(Array.isArray(cfg.fori)?cfg.fori:[]).map(function(f){
    return { x:(+f.x||0)*k, y:(+f.y||0)*k, r:(Math.abs(+f.d||0)/2)*k };
  }).filter(function(f){ return f.r>0; });

  var str=(Array.isArray(cfg.strati)&&cfg.strati.length)? cfg.strati : null;
  var sp=parseFloat(_val(cfg,campi,'spessore',/spessore|altezza/,0))||0;
  var d=[], y=0;
  if(str){
    str.forEach(function(st,i){
      var h=Math.max(1,(+st.h||10))*k;
      var _t=(typeof _tint==='function')? _tint(String(st.col||'')) : null;
      var col=(_t!=null)? _t : ((COLORI[st.col]&&COLORI[st.col].hex)? COLORI[st.col].hex : '#8AA9A6');
      d.push({tipo:'sagomata', params:{pts:P, fori:fori, h:h, color:_hexInt(col)},
              pos:[0,y,0], expl:[0,0.12*(i+1),0]});
      y+=h;
    });
  } else {
    var h1=Math.max(1,sp||40)*k;
    d.push({tipo:'sagomata', params:{pts:P, fori:fori, h:h1, color:0x8AA9A6}, pos:[0,0,0]});
  }
  return d;
}
function distinta3dStrati(cfg,campi){
  /* Le misure si leggono dai RUOLI, non da un campo cablato: i mondi nati in Officina
     hanno lunghezza/larghezza in MM; il mondo materasso storico ha `misura` in CM.
     L'unita' dello strato segue la stessa sorgente (mm coi campi, cm con misura). */
  var W=null,D=null,uStr=0.01;
  if(campi&&typeof _val==='function'){
    var _l=parseFloat(_val(cfg,campi,'lunghezza',/lunghezz|profondit/,null));
    var _la=parseFloat(_val(cfg,campi,'larghezza',/larghezz/,null));
    if(_l>0){ D=_l/1000; W=(_la>0?_la:_l*0.55)/1000; uStr=0.001; }
  }
  if(W==null){ var mp=_splitMis(cfg.misura||'160x200'); W=(mp[0]||160)/100; D=(mp[1]||200)/100; }
  var _ONDE=0;
  if(campi && typeof _val==='function') _ONDE=parseFloat(_val(cfg,campi,'onde',/onde|ondulaz/,0))||0;
  var k=1.6/Math.max(W,D,0.01);                         /* fit d'inquadratura, proporzioni intatte */
  var str=Array.isArray(cfg.strati)?cfg.strati:[];
  var d=[],y=0;
  /* ampiezza comune: non deve mai superare lo strato piu' sottile, altrimenti
     un'onda buca lo strato accanto e l'annidamento salta */
  var _hMin=1e9;
  str.forEach(function(st){ _hMin=Math.min(_hMin, Math.max(0.003,(+st.h||3)*uStr)); });
  var _AMP=(_ONDE>0)? _hMin*k*2.2*0.34 : 0;
  var _N=str.length;
  str.forEach(function(st,i){
    var mat=MATERIALI[st.mat]||{};
    /* stessa tavolozza del resto del file: _tint conosce i sinonimi e i colori
       che COLORI (tavolozza ristretta del materasso storico) non ha, es. NERO. */
    var _t=(typeof _tint==='function')? _tint(String(st.col||'')) : null;
    var col=(_t!=null)? _t
          : ((COLORI[st.col]&&COLORI[st.col].hex)? COLORI[st.col].hex : (mat.col||'#8AA9A6'));
    var h=Math.max(0.003,(+st.h||3)*uStr);
    /* (07ago2026) il molleggio si riconosce dal materiale dichiarato OPPURE dal nome
       dello strato. Senza anagrafica materiali MATERIALI[st.mat] e' vuoto, quindi
       su una libreria generata lo strato a molle non si vedeva mai. */
    var _eMolle = !!mat.molle || /moll|insacchett|spring|bonnell/i.test(String(st.nome||'')+' '+String(st.mat||''));
    d.push({tipo:(_eMolle?'molleggio':'lastra'),
            /* (10ago2026) SFARFALLIO: la faccia superiore di uno strato e quella
               inferiore del successivo stavano nello STESSO piano. La scheda
               grafica non sa quale disegnare davanti e le alterna a ogni
               fotogramma — i colori tremolano. Ogni strato si ritira di una
               frazione impercettibile: le facce non coincidono piu' e il
               tremolio sparisce. La posizione NON cambia: il pezzo resta
               spesso quanto dichiara. */
            params:{w:W*k, h:Math.max(h*k*2.2*0.995, h*k*2.2-0.0006), d:D*k,
                    color:_hexInt(col), onde:_ONDE, amp:_AMP,
                    zone:(Array.isArray(cfg.zone)?cfg.zone:[]),
                    pianoGiu:(i===0), pianoSu:(i===_N-1)},
            pos:[0,(y+h/2)*k*2.2,0],
            expl:[0,0.10*(i+1),0]});
    y+=h;
  });
  if(!d.length) d.push({tipo:'cuscino',params:{w:W*k,h:0.2,d:D*k,color:0x8AA9A6},pos:[0,0.1,0]});
  return d;
}
