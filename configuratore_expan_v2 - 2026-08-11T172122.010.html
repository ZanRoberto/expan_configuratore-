<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ── IMPIANTO GRAFICO (07ago2026) ────────────────────────────────────────
   IBM Plex: famiglia disegnata per strumenti tecnici. Condensed per i titoli,
   Mono per i dati (continua una scelta gia' presente), Sans per il resto.
   L'AMBRA E' RAZIONATA: compare solo dove la macchina ha deciso qualcosa.
   Il 3D sta su BANCO SCURO, come un pezzo in collaudo: e' l'unico punto in cui
   il prodotto deve staccarsi dalla pagina. */
:root{--ink:#14181F;--ink-2:#1D232C;--paper:#F3F1EC;--card:#FBFAF7;--line:#E2DED5;--petrol:#0E6B66;--petrol-soft:#E4EFEE;--amber:#E8A33D;--amber-soft:#FBEFD8;--grey:#6E7680;--grey-2:#9AA2AC;--red:#8A4444;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
header{background:var(--ink);color:#EDEFEA;padding:12px 18px;position:sticky;top:0;z-index:50}
header h1{font-family:var(--cond);font-size:22px;font-weight:600;letter-spacing:.4px}header h1 .light{color:var(--amber)}
header .sub{font-family:var(--mono);font-size:10.5px;color:#9AA7B0;margin-top:2px}
.mondi{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.mondi .lbl{font-family:var(--mono);font-size:10px;color:#7C8894;margin-right:2px}
.mondi button{font-family:var(--mono);font-size:11px;font-weight:400;padding:5px 13px;border-radius:3px;border:1px solid #333B46;background:transparent;color:var(--grey-2);cursor:pointer;letter-spacing:.2px}
.mondi button.regoff{border-color:#4A3F2A;color:#9A8A66}
.mondi button.regon{border-color:var(--amber);color:var(--amber)}
.mondi button.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.mondi button.def{border-style:dashed;color:#C79A4B}
.mondi button.lock{opacity:.5}
.admin{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #2A313C}
.admin .lbl{font-family:var(--mono);font-size:9.5px;color:#7C8894}
.admin .lbl.locked{color:#6E5A2A}
.admin .sep{width:1px;height:16px;background:#3A424E;margin:0 4px}
.admin button{font-family:var(--mono);font-size:10px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid #3A424E;background:transparent;color:#9AA7B0;cursor:pointer}
.admin button.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.admin button.gen{border-color:var(--amber);color:var(--amber)}
.mondi .solo{font-size:9px;padding:3px 7px;border-style:dashed}
main{max-width:1280px;margin:0 auto;padding:26px 22px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px}
.sh{display:flex;align-items:center;gap:10px;padding:15px 22px;background:transparent;border-bottom:1px solid var(--line)}
.sh.acc{background:var(--petrol-soft)}
.sh .tag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--amber)}
.sh h2{font-family:var(--cond);font-size:19px;font-weight:600;letter-spacing:-.1px}
.sb{padding:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.g2{grid-template-columns:1fr}}
.fld{margin-bottom:10px}
.fld label{display:block;font-family:var(--mono);font-size:10px;font-weight:700;color:#5A6570;margin-bottom:4px}
.fld input,.fld select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:14px;background:#fff;font-family:var(--sans)}
.btn{border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--petrol);color:#fff}.btn-ghost{background:#fff;color:var(--petrol);border:1px solid var(--petrol)}
.btn-amber{background:var(--amber);color:var(--ink)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.olines{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.oline{display:grid;grid-template-columns:44px 1fr 70px 90px 30px;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#FBFBF9;cursor:pointer}
.oline.active{border-color:var(--petrol);background:var(--petrol-soft)}
.oline .fam{font-family:var(--mono);font-size:9px;font-weight:700;text-align:center;padding:4px 0;border-radius:5px;background:var(--ink);color:#fff}
.oline .desc{font-size:13px}.oline .desc small{display:block;color:var(--grey);font-size:11px;font-family:var(--mono)}
.oline .qta input{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;text-align:center}
.oline .prz{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.oline .del{width:26px;height:26px;border:none;background:none;color:var(--red);cursor:pointer;font-weight:700}
.editorwrap{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}@media(max-width:820px){.editorwrap{grid-template-columns:1fr}}
canvas#disegno{width:100%;height:360px;display:block;border:0;border-radius:3px;
  background:radial-gradient(120% 90% at 50% 16%, #2B333E 0%, #171C24 56%, #11151B 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.toggle{display:flex;gap:6px;margin-bottom:8px}
.toggle{gap:0;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:14px}
.toggle button{font-family:var(--mono);font-size:11px;font-weight:400;padding:8px 15px;border-radius:0;border:0;border-bottom:2px solid transparent;background:none;color:var(--grey);cursor:pointer;letter-spacing:.3px}
.toggle button.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:500}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.k{background:var(--card);padding:13px 16px}
.k .l{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--grey);letter-spacing:.1em}
.k .v{font-family:var(--cond);font-size:21px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.k.big{grid-column:1/-1;background:var(--card);padding:20px 16px}
.k.big .l{color:var(--petrol)}
.k.big .v{color:var(--petrol);font-size:42px;line-height:1.05;letter-spacing:-1px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--grey);letter-spacing:.1em;text-transform:uppercase}
td{font-size:13.5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.distgrp{margin-bottom:12px}
.distgrp .gt{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--petrol);margin-bottom:4px}
.note{font-family:var(--mono);font-size:10px;color:var(--grey);margin-top:9px}
/* ── QUADRO REGOLE ── */
.ivp{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.ivb{height:100%;background:var(--amber);transition:width .25s}
.ivn{font-family:var(--mono);font-size:10.5px;color:var(--grey);margin-bottom:18px}
.ivfam{font-size:13px;line-height:1.6;padding:10px 13px;border-radius:3px;margin-bottom:16px}
.ivfam.ok{background:var(--petrol-soft);color:var(--petrol);border-left:3px solid var(--petrol)}
.ivfam.att{background:#F7F6F1;color:var(--grey);border-left:3px solid var(--line)}
.ivfam.ko{background:#FDF3F2;color:var(--red);border-left:3px solid var(--red)}
.ivfam span{color:var(--grey);font-size:12px}
.ivfr{font-family:var(--mono);font-size:11px;margin-top:6px;color:var(--red)}
.ivstor{margin-bottom:18px}
.ivsr.auto b{color:var(--grey)}
.ivsr.auto:after{content:'dalla famiglia';font-family:var(--mono);font-size:9px;color:var(--grey-2);margin-left:8px}
.ivsr{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--grey)}
.ivsr b{color:var(--petrol);font-weight:500;cursor:pointer;white-space:nowrap}
.ivsr b:hover{text-decoration:underline}
.ivq{font-family:var(--cond);font-size:24px;font-weight:600;line-height:1.25;margin-bottom:8px}
.ivh{font-size:13px;color:var(--grey);margin-bottom:18px;line-height:1.6}
.ivopz{display:flex;flex-wrap:wrap;gap:8px}
.ivo{font-size:14px;padding:11px 20px;border:1px solid var(--line);border-radius:3px;background:var(--card);cursor:pointer;font-family:var(--sans)}
.ivo:hover{border-color:var(--petrol);color:var(--petrol);background:var(--petrol-soft)}
.ivo.ivfin{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.ivo.ivvar{background:#5B3E7A;color:#fff;border-color:#5B3E7A}
.ivo.ivno{border-color:#EADFDC;color:var(--grey-2);background:#FBF7F6;cursor:not-allowed;
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 16px}
.ivo.ivno:hover{border-color:#EADFDC;color:var(--grey-2);background:#FBF7F6}
.ivo.ivno i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--red);max-width:240px;line-height:1.35}
.ivin{display:flex;gap:8px}
.ivin input{flex:1;height:44px;border:1px solid var(--line);border-radius:3px;padding:0 13px;font-size:15px;font-family:var(--sans)}
.ivin input:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-soft)}
.ivdiff{margin:0 0 18px}
.ivdr{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:9px 12px;border-left:3px solid var(--amber);background:#FFFDF7;margin-bottom:6px}
.ivdr span{font-family:var(--mono);font-size:11px;color:var(--grey);min-width:120px}
.ivdr b{font-size:13px;color:var(--petrol);font-weight:500}
.ivdr i{font-family:var(--mono);font-size:11px;font-style:normal;color:#8A6D2A}
.ivalt{margin-bottom:18px;font-family:var(--mono);font-size:11px;color:var(--grey);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ivo.ivsm{font-size:12px;padding:6px 12px}
.ivnome{margin-bottom:18px}
.ivnome label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--grey);margin-bottom:6px}
.segnint{font-family:var(--mono);font-size:10px;letter-spacing:.06em;border-radius:2px;padding:3px 9px}
.segnint.ok{background:var(--petrol-soft);color:var(--petrol)}
.segnint.no{background:#FBEFD8;color:#8A6D2A}
.segnint.var{background:#EFE7F5;color:#5B3E7A;border:1px solid #D9C9E8}
.segnint.att{background:#FBEFD8;color:#8A6D2A;border:1px solid #EFE2C8}
.mondi button.appbadge{border-color:#5B3E7A;color:#B79BD6}
.mondi button.appbadge.sc{border-color:var(--red);color:#D99}
.apr{border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
.apr.fatta{opacity:.6;padding:10px 14px}
.aprn{font-family:var(--cond);font-size:19px;font-weight:600}
.aprd{font-family:var(--mono);font-size:11px;color:var(--grey);margin-top:4px}
.aprt{font-family:var(--mono);font-size:11px;color:#8A6D2A;margin-top:8px}
.aprb{display:flex;gap:8px;margin-top:12px}
.aprs{font-family:var(--mono);font-size:11px;margin-top:6px}
.aprs.ok{color:var(--petrol)}
.aprs.no{color:var(--red)}
.scnasce{padding:14px;border-top:1px solid #F3D9D6;background:#FBFAF7}
.scnasce label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--grey);margin-bottom:7px}
.scrow{display:flex;gap:8px}
.scrow input{flex:1;height:42px;border:1px solid var(--petrol);border-radius:3px;padding:0 12px;font-size:15px;font-family:var(--sans)}
.scnote{font-size:12px;color:var(--grey);margin-top:8px;line-height:1.5}
.ivnome input{width:100%;height:44px;border:1px solid var(--petrol);border-radius:3px;padding:0 13px;font-size:16px;font-family:var(--sans)}
.scost{margin-top:16px;border:1px solid var(--amber);border-radius:3px;background:#FFFDF7;overflow:hidden}
.scost.gr{border-color:var(--red);background:#FDF3F2}
.sch{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #EFE2C8;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#8A6D2A}
.scost.gr .sch{border-bottom-color:#F3D9D6;color:var(--red)}
.sch b{font-weight:500;letter-spacing:0}
.scr{padding:10px 14px;border-bottom:1px solid #F2E9D6}
.scost.gr .scr{border-bottom-color:#F7E2DF}
.scr:last-of-type{border-bottom:0}
.scd{font-size:13.5px;font-weight:500}
.scv{font-family:var(--mono);font-size:11.5px;color:var(--grey);margin-top:3px}
.scv b{color:var(--ink);font-weight:500}
.scr.gr .scv b{color:var(--red)}
.scv i{font-style:normal;color:var(--red);font-size:10.5px}
.scf{padding:9px 14px;border-top:1px solid #F3D9D6;font-size:12.5px;color:var(--red);background:#FBEAE8;line-height:1.5}
.ivrec{margin-top:16px;border:1px solid var(--line);border-radius:3px;background:var(--card);overflow:hidden}
.ivrh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--grey)}
.ivrh b{font-weight:500;letter-spacing:0;color:var(--ink)}
.ivrr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.ivrr:last-child{border-bottom:0}
.ivrr .ivrd{color:var(--grey)}
.ivrr b{color:var(--petrol);font-weight:500;white-space:nowrap}
.ivrr.orf{background:#FFFDF7}
.ivrr.orf b{color:#8A6D2A}
.ivrr i{font-family:var(--mono);font-size:9.5px;font-style:normal;color:#8A6D2A;background:#F1EAD9;border-radius:2px;padding:2px 7px;white-space:nowrap}
.manca{margin-top:16px;border:1px solid var(--amber);border-radius:3px;background:#FFFDF7;overflow:hidden}
.manca .mh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #EFE2C8;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#8A6D2A}
.manca .mh b{font-weight:500;letter-spacing:0;color:#8A6D2A}
.mr{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:11px 14px;border-bottom:1px solid #F2E9D6}
.mr:last-of-type{border-bottom:0}
.mr .mt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;background:#F1EAD9;color:#8A6D2A;border-radius:2px;padding:3px 8px;white-space:nowrap}
.mr .mc{font-size:13.5px;font-weight:500}
.mr .md{font-size:12.5px;color:var(--grey);margin-top:3px;line-height:1.5}
.manca .mf{padding:9px 14px;border-top:1px solid #EFE2C8;font-family:var(--mono);font-size:10.5px;color:#8A6D2A;background:#FDF8EC}
.quadro{margin-top:16px;border:1px solid var(--line);border-radius:3px;background:var(--card);overflow:hidden}
.quadro .qh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--grey)}
.quadro .qh b{font-weight:500;color:var(--ink);letter-spacing:0}
.qctx{padding:9px 14px;background:#F7F6F1;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--grey);line-height:1.7}
.qctx b{color:var(--ink);font-weight:500}
.qctx span{color:var(--grey-2)}
.qleg{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:10px;color:var(--grey-2)}
.qleg .bnd{margin-left:14px}
.qleg .bnd:first-child{margin-left:0}
.qr{display:grid;grid-template-columns:3px 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.qmod{border:1px solid var(--line);background:var(--card);color:var(--grey);border-radius:3px;width:28px;height:26px;cursor:pointer;font-size:12px;line-height:1}
.qmod:hover{border-color:var(--petrol);color:var(--petrol)}
.qmod.anag{border-style:dashed;color:#8A6D2A}
.qedit{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:10px}
.qedit input{flex:1;height:36px;border:1px solid var(--petrol);border-radius:3px;padding:0 11px;font-size:14px;font-family:var(--sans)}
.qedit button{height:36px;border-radius:3px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--mono);font-size:11px;padding:0 13px}
.qedit button.ok{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.qedit button.rm{color:var(--red)}
.qletta{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;color:var(--grey);margin-top:6px}
.qletta.ko{color:var(--red)}
.qr:last-child{border-bottom:0}
.qr i{width:3px;height:100%;min-height:26px;border-radius:2px;background:var(--line);display:block}
.qr.att i{background:var(--amber)}
.qr.blk i{background:var(--red)}
.qr.sov i{background:var(--grey-2)}
.qr .qt{font-size:13.5px;line-height:1.35}
.qr .qc{font-family:var(--mono);font-size:10.5px;color:var(--grey-2);margin-top:3px;word-break:break-all}
.qr .qe{font-family:var(--mono);font-size:11px;color:var(--petrol);white-space:nowrap;text-align:right}
.qr.off{opacity:.5}
.qr.off .qe{color:var(--grey-2)}
.qr.blk .qe{color:var(--red)}
.qr.sov{background:#F7F4EE}
.qr.sov .qt{text-decoration:line-through;color:var(--grey)}
.qr.sov .qe{color:var(--red)}
.qr.rot i{background:var(--red)}
.qr.rot{background:#FDF3F2}
.qr.rot .qe{color:var(--red);font-weight:500}
.qr.rot .qc{color:var(--red)}
.qr:hover{background:var(--petrol-soft)}
.qgt{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:#F7F6F1;border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--grey)}
.qgt b{font-weight:400;letter-spacing:0;font-size:10.5px;color:var(--grey-2)}
.bnd{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;border-radius:2px;padding:2px 7px;margin-right:8px;vertical-align:1px;min-width:20px;text-align:center}
.bnd.cli{background:var(--petrol-soft);color:var(--petrol)}            /* accordo con un cliente */
.bnd.azi{background:#F1EAD9;color:#8A6D2A}                              /* vale per tutti: l'asterisco che usi sui fornitori */
.bnd.pro{background:#EDEBE4;color:var(--grey-2)}                        /* vincolo del prodotto: il caso normale, quasi muto */
.seal .row{display:flex;align-items:center;gap:8px;padding:5px 0;font-family:var(--mono);font-size:12px}
.seal .prog{margin-top:9px;background:#FBFBF9;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11px;line-height:1.7}
.empty{font-family:var(--mono);font-size:12px;color:var(--grey);padding:10px}
.addpanel{position:fixed;top:0;right:0;height:100vh;width:300px;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);transform:translateX(320px);transition:transform .22s;z-index:80;overflow-y:auto;padding:0}

window.VERSIONE_COLORI = 'SENZAGUSCI-06AGO-1230';
/* (04ago2026) Nessun messaggio all'avvio: la console non deve aprirsi da sola.
   La versione si legge dal pulsante "i" e resta in window.VERSIONE_COLORI. */
/* ═══ BADGE DI DIAGNOSI — scritto SUL DISEGNO, non in console.

   modello e quanti ne sono stati colorati. Niente piu' correzioni al buio. ═══ */

/* avviso NON bloccante: un problema di rete non deve fermare il lavoro con un popup da cliccare */
window._avviso=function(txt){

      document.body.appendChild(t); }
    t.textContent=txt; t.style.display='block';
    clearTimeout(window._avvisoT); window._avvisoT=setTimeout(function(){ t.style.display='none'; },6000);

window._INFO_APERTO=false;
/* (05ago2026) Il pannello informazioni ora e' ANCORATO ALLA FINESTRA, non al
   contenitore del disegno: prima veniva appeso dentro il riquadro 3D e poteva
   finire fuori vista o sotto il canvas — si premeva "i" e non compariva niente. */
window._diagMostra=function(){
  try{
    var b=document.getElementById('diagBadge');

      b=document.createElement('div'); b.id='diagBadge';

<script>
function parseDXF(text){
  const lines = text.split(/\r\n|\r|\n/);
  const pairs = [];
  for(let i=0;i+1<lines.length;i+=2){
    pairs.push([lines[i].trim(), lines[i+1]]);
  }
  const ents = []; let cur=null;
  const flush = ()=>{ if(cur) ents.push(cur); cur=null; };
  for(let i=0;i<pairs.length;i++){
    const [code,val]=pairs[i];
    if(code==='0'){
      const t=(val||'').trim().toUpperCase();
      if(t==='VERTEX'){
        /* i 10/20 che seguono sono i vertici della POLYLINE corrente: NON chiudere */
      } else if(t==='SEQEND'){
        flush();
      } else if(['LWPOLYLINE','POLYLINE','LINE','CIRCLE','ARC','SPLINE','TEXT','MTEXT'].includes(t)){
        flush(); cur={type:t,xs:[],ys:[],closed:false,r:null,txt:'',layer:''};
      } else { flush(); }
    } else if(cur){
      if(code==='10'||code==='11') cur.xs.push(parseFloat(val));
      else if(code==='20'||code==='21') cur.ys.push(parseFloat(val));
      else if(code==='40'&&cur.type==='CIRCLE') cur.r=parseFloat(val);
      else if(code==='70'&&cur.xs.length===0&&(cur.type==='LWPOLYLINE'||cur.type==='POLYLINE')) cur.closed=(parseInt(val)&1)===1;
      else if((code==='1'||code==='3')&&(cur.type==='TEXT'||cur.type==='MTEXT')) cur.txt+=val;
      else if(code==='8') cur.layer=(val||'').trim();
    }
  }
  flush();

  // ── annotazioni testuali (il CAD che DICHIARA il modello) ──────────────
  const rawTesti = ents.filter(e=>(e.type==='TEXT'||e.type==='MTEXT')&&e.txt&&e.txt.trim())
    .map(e=>({s:e.txt.replace(/\\[A-Za-z][^;]*;/g,'').replace(/[{}]/g,'').trim(),
              x:e.xs[0]||0, y:e.ys[0]||0}));
  const testi = rawTesti.map(t=>t.s).filter(Boolean);
  // separa quote (label:numero) da variabili (etichette) e header
  const HEADER=/^(quote|variabili|legenda|note)\b/i;
  const quote=[], variabili=[];
  testi.forEach(s=>{
    if(HEADER.test(s)) return;
    const m=s.match(/^(.+?)\s*[:=]\s*([+\-]?\d[\d\.,\-\s]*)\s*(mm|cm|m)?/i);
    if(m){ quote.push({label:m[1].trim(), val:m[2].replace(/\s/g,''), unita:m[3]||'mm'}); }
    else if(s.length<=28 && !/[.]{2,}/.test(s)){ variabili.push(s.split('/')[0].trim()); }
  });
  const dichiarazione = {quote, variabili, testi};

  const clean = ents.filter(e=>e.xs.length||e.r!=null);
  clean.forEach(e=>{ e.xs=e.xs.filter(v=>!isNaN(v)); e.ys=e.ys.filter(v=>!isNaN(v)); });

  // bounding box globale
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  clean.forEach(e=>{
    e.xs.forEach(x=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x)});
    e.ys.forEach(y=>{minY=Math.min(minY,y);maxY=Math.max(maxY,y)});
    if(e.r!=null&&e.xs.length){const cx=e.xs[0],cy=e.ys[0];
      minX=Math.min(minX,cx-e.r);maxX=Math.max(maxX,cx+e.r);
      minY=Math.min(minY,cy-e.r);maxY=Math.max(maxY,cy+e.r);}
  });
  const W=isFinite(maxX-minX)?Math.round(maxX-minX):0;
  const H=isFinite(maxY-minY)?Math.round(maxY-minY):0;

  // polilinee chiuse -> centroide + dimensione
  const closed = clean.filter(e=>(e.type==='LWPOLYLINE'&&e.closed)||(e.type==='POLYLINE'));
  const boxes = closed.map(e=>{
    const bx=Math.round(Math.max(...e.xs)-Math.min(...e.xs));
    const by=Math.round(Math.max(...e.ys)-Math.min(...e.ys));
    const cx=(Math.max(...e.xs)+Math.min(...e.xs))/2;
    const cy=(Math.max(...e.ys)+Math.min(...e.ys))/2;
    return {bx,by,cx,cy};
  });
  // il contorno = box più grande; gli altri = candidati vani/moduli
  boxes.sort((a,b)=>(b.bx*b.by)-(a.bx*a.by));
  const inner = boxes.slice(1);
  // raggruppa per dimensione simile (arrotondata a 10)
  const groups={};
  inner.forEach(b=>{const k=Math.round(b.bx/10)*10+'x'+Math.round(b.by/10)*10;(groups[k]=groups[k]||[]).push(b)});
  let bigGroup=null,bigKey=null;
  for(const k in groups){if(!bigGroup||groups[k].length>bigGroup.length){bigGroup=groups[k];bigKey=k}}
  // stima griglia cols x rows dal cluster
  let grid=null;
  if(bigGroup&&bigGroup.length>=2){
    const clust=(vals)=>{vals=vals.slice().sort((a,b)=>a-b);let n=1;for(let i=1;i<vals.length;i++)if(vals[i]-vals[i-1]>15)n++;return n;};
    const cols=clust(bigGroup.map(b=>b.cx));
    const rows=clust(bigGroup.map(b=>b.cy));
    grid={cols,rows,count:bigGroup.length,size:bigKey};
  }
  const circles = clean.filter(e=>e.type==='CIRCLE');
  const holeR = circles.length?Math.round(circles.reduce((s,c)=>s+c.r,0)/circles.length):null;

  // geometria disegnabile: polilinee (con punti) + cerchi + bounds
  const polys = clean.filter(e=>e.xs.length>=2 && (e.type==='LWPOLYLINE'||e.type==='POLYLINE'||e.type==='LINE'))
    .map(e=>{
      const pts=e.xs.map((x,i)=>[x, e.ys[i]!=null?e.ys[i]:0]);
      const area=(Math.max(...e.xs)-Math.min(...e.xs))*(Math.max(...e.ys)-Math.min(...e.ys));
      return {pts, closed:e.closed||e.type==='POLYLINE', area, layer:e.layer||''};
    });
  const circ2 = circles.filter(c=>c.xs.length).map(c=>({cx:c.xs[0],cy:c.ys[0],r:c.r,layer:c.layer||''}));
  const geom = {
    bounds:{minX:isFinite(minX)?minX:0,minY:isFinite(minY)?minY:0,
            maxX:isFinite(maxX)?maxX:0,maxY:isFinite(maxY)?maxY:0},
    polys, circles:circ2
  };

  return {
    W,H,
    entita:clean.length,
    chiuse:closed.length,
    linee:clean.filter(e=>e.type==='LINE').length,
    cerchi:circles.length,
    holeR,
    grid,
    ripetute: bigGroup?bigGroup.length:0,
    dimRip: bigKey,
    geom,
    dichiarazione
  };
}

/* ═══════════════════════════════════════════════════════════════════════
   MOTORE DI DISEGNO — parametrico, quotato, scomponibile, a colori
   Tre viste per gli archetipi: strati · moduli · profilo
   Nessun 3D esterno: proiezione obliqua 2.5D, un solo file.
   ═══════════════════════════════════════════════════════════════════════ */
const PAL=['#0E6B66','#E8A33D','#8AA9A6','#C98A4B','#5A6E8C','#9C6B8E','#7A9A6B','#B85C5C'];

function dimLine(ctx,x1,y1,x2,y2,label){
  ctx.strokeStyle='#8A94A0';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1),t=3.5,px=Math.cos(a+Math.PI/2)*t,py=Math.sin(a+Math.PI/2)*t;
  [[x1,y1],[x2,y2]].forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(x-px,y-py);ctx.lineTo(x+px,y+py);ctx.stroke();});
  const mx=(x1+x2)/2,my=(y1+y2)/2,horiz=Math.abs(y2-y1)<Math.abs(x2-x1);
  ctx.font='600 10px ui-monospace,monospace';const w=ctx.measureText(label).width;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(horiz){ctx.fillStyle='#fff';ctx.fillRect(mx-w/2-3,my-7,w+6,13);ctx.fillStyle='#4A5560';ctx.fillText(label,mx,my);}
  else{ctx.save();ctx.translate(mx,my);ctx.rotate(-Math.PI/2);ctx.fillStyle='#fff';ctx.fillRect(-w/2-3,-7,w+6,13);ctx.fillStyle='#4A5560';ctx.fillText(label,0,0);ctx.restore();}
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function shade(hex,f){ // f>1 schiarisce, f<1 scurisce
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.min(255,Math.round(r*f));g=Math.min(255,Math.round(g*f));b=Math.min(255,Math.round(b*f));
  return`rgb(${r},${g},${b})`;
}

// costruisce uno spec disegnabile dalla geometria letta, se il motore non lo fornisce
function buildSpecFromGeo(g,archetipo){
  if(!g) return null;
  if(archetipo==='strati')
    return {vista:'strati',W:g.W||600,P:Math.round((g.H||400)*0.7),
      parti:[{nome:'Strato 1',colore:PAL[0],spessore:Math.round((g.H||200)/3)},
             {nome:'Strato 2',colore:PAL[1],spessore:Math.round((g.H||200)/3)},
             {nome:'Strato 3',colore:PAL[2],spessore:Math.round((g.H||200)/3)}]};
  if(g.grid||archetipo==='estrusione_moduli'||archetipo==='estrusione_vani')
    return {vista:'moduli',W:g.W||600,H:g.H||400,
      cols:g.grid?g.grid.cols:3,rows:g.grid?g.grid.rows:2,
      colore:PAL[0],fori:g.cerchi||0};
  // profilo / estrusione generica
  return {vista:'profilo',
    parti:[{nome:'Corpo',colore:PAL[0],lunghezza:g.W||120,forma:'cilindro',d:Math.max(20,Math.round((g.H||30)))}]};
}

function renderDisegno(canvas,spec,esploso){
  if(!canvas||!spec) return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const CW=canvas.clientWidth||520,CH=canvas.clientHeight||360;
  canvas.width=CW*dpr;canvas.height=CH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,CW,CH);
  if(spec.vista==='strati') drawStrati(ctx,CW,CH,spec,esploso);
  else if(spec.vista==='moduli') drawModuli(ctx,CW,CH,spec,esploso);
  else if(spec.vista==='assieme') { if(spec.kind==='sedia') drawSedia(ctx,CW,CH,spec,esploso); else drawAssieme(ctx,CW,CH,spec,esploso); }
  else drawProfilo(ctx,CW,CH,spec,esploso);
}

function drawStrati(ctx,CW,CH,spec,esploso){
  const parti=spec.parti||[];if(!parti.length)return;
  const totH=parti.reduce((s,p)=>s+(+p.spessore||0),0)||1;
  const W=+spec.W||600;
  const gap=esploso?18:0, gaps=gap*(parti.length-1);
  const marginR=76, marginL=8, marginT=16, marginB=30;
  const ON=(spec.onde&&+spec.onde.n>0)?spec.onde:null;      /* ← il profilo ondulato */
  /* ── LA PROFONDITA' E' UNA MISURA, NON UNA COSTANTE (03ago2026)
     prima era una costante di 22 pixel e spec.P non entrava MAI nel disegno:
     un 1900x1800 e un 1900x800 uscivano identici. Ora la fuga e' in scala vera. */
  const P=+spec.P||0;
  const CX=0.866, CY=0.5;                 /* fuga a 30 gradi: lo spigolo di profondita' misura P*sc, come il fronte */
  const kON=(ON?1.25:1);
  const availW=CW-marginL-marginR, availH=CH-marginT-marginB-gaps;
  /* una passata sola: l'ingombro totale contiene gia' la fuga, quindi la scala si ricava in chiuso.
     Cosi' la profondita' non viene mai tagliata da un limite: resta sempre in proporzione. */
  const sc=Math.min(availW/(W+P*CX), availH/(totH*kON+P*CY));
  const dxD=P*sc*CX, dyD=P*sc*CY;
  const bw=W*sc;
  const x0=marginL+ (availW-bw)/2 + 4;
  const A = ON ? (ON.amp>0 ? Math.min(ON.amp*sc, totH*sc*0.22) : Math.min(totH*sc*0.10,15)) : 0;
  const STEP=Math.max(2,bw/140);
  function wy(x){ return ON ? A*Math.sin((x-x0)/bw*ON.n*Math.PI*2) : 0; }
  /* la faccia SUPERIORE del materasso è piatta (ci si dorme), la INFERIORE pure (appoggia sul letto).
     le onde stanno DENTRO, fra strato e strato. */
  function wyT(x,i){ return (i===parti.length-1) ? 0 : wy(x); }   /* i = indice dal basso: l'ultimo è in cima → piatto */
  function wyB(x,i){ return (i===0) ? 0 : wy(x); }                /* il primo è in basso → piatto */
  let y=CH-marginB-(ON?A:0);
  const drawn=[];
  parti.slice().reverse().forEach((p,ri)=>{
    const iB=ri;                              /* si disegna dal basso: ri=0 è lo strato di fondo */
    const h=(+p.spessore||0)*sc;
    const yt=y-h;
    if(ON){
      /* strato ONDULATO: due curve parallele (sopra e sotto) — si annidano come nel pressato vero */
      ctx.beginPath();                                    /* faccia superiore (in prospettiva) */
      ctx.moveTo(x0,yt+wyT(x0,iB));
      for(let x=x0+STEP;x<=x0+bw;x+=STEP)ctx.lineTo(x,yt+wyT(x,iB));
      ctx.lineTo(x0+bw,yt+wyT(x0+bw,iB));
      ctx.lineTo(x0+bw+dxD,yt+wyT(x0+bw,iB)-dyD);
      for(let x=x0+bw;x>=x0;x-=STEP)ctx.lineTo(x+dxD,yt+wyT(x,iB)-dyD);
      ctx.closePath();
      ctx.fillStyle=shade(p.colore||'#888',1.18);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke();
      const wRt=wyT(x0+bw,iB), wRb=wyB(x0+bw,iB);        /* fianco destro */
      ctx.beginPath();ctx.moveTo(x0+bw,yt+wRt);ctx.lineTo(x0+bw+dxD,yt+wRt-dyD);ctx.lineTo(x0+bw+dxD,yt+h+wRb-dyD);ctx.lineTo(x0+bw,yt+h+wRb);ctx.closePath();
      ctx.fillStyle=shade(p.colore||'#888',.78);ctx.fill();ctx.stroke();
      ctx.beginPath();                                    /* fronte: la fascia fra le due curve */
      ctx.moveTo(x0,yt+wyT(x0,iB));
      for(let x=x0+STEP;x<=x0+bw;x+=STEP)ctx.lineTo(x,yt+wyT(x,iB));
      ctx.lineTo(x0+bw,yt+h+wyB(x0+bw,iB));
      for(let x=x0+bw;x>=x0;x-=STEP)ctx.lineTo(x,yt+h+wyB(x,iB));
      ctx.closePath();
      ctx.fillStyle=p.colore||'#888';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke();
    } else {
      ctx.beginPath();ctx.moveTo(x0,yt);ctx.lineTo(x0+dxD,yt-dyD);ctx.lineTo(x0+dxD+bw,yt-dyD);ctx.lineTo(x0+bw,yt);ctx.closePath();
      ctx.fillStyle=shade(p.colore||'#888',1.18);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke();
      ctx.beginPath();ctx.moveTo(x0+bw,yt);ctx.lineTo(x0+dxD+bw,yt-dyD);ctx.lineTo(x0+dxD+bw,yt-dyD+h);ctx.lineTo(x0+bw,y);ctx.closePath();
      ctx.fillStyle=shade(p.colore||'#888',.78);ctx.fill();ctx.stroke();
      ctx.fillStyle=p.colore||'#888';ctx.fillRect(x0,yt,bw,h);ctx.strokeStyle='rgba(0,0,0,.3)';ctx.strokeRect(x0,yt,bw,h);
    }
    drawn.push({p,yt,h,y});
    ctx.font='600 10px ui-monospace,monospace';ctx.fillStyle='#fff';ctx.textBaseline='middle';
    if(h>14){ctx.fillText(' '+(p.nome||''),x0+4,yt+h/2+(ON?wyT(x0+bw*0.12,iB)*0.5:0));}
    ctx.textBaseline='alphabetic';
    dimLine(ctx,x0+dxD+bw+14,yt-dyD,x0+dxD+bw+14,yt-dyD+h,(+p.spessore||0)+'');
    y=yt-gap;
  });
  // quota totale (estrema destra) e larghezza (basso)
  const topY=y+gap;
  dimLine(ctx,x0+dxD+bw+52,topY-dyD,x0+dxD+bw+52,CH-marginB-dyD,'H '+totH);
  dimLine(ctx,x0,CH-marginB+14,x0+bw,CH-marginB+14,'L '+W+(P>0?('  ·  P '+P):''));
  ctx.font='600 11px ui-monospace,monospace';ctx.fillStyle='#6B7680';
  ctx.fillText((esploso?'esploso':'compatto')+' · '+parti.length+' strati'+(spec.onde&&spec.onde.n>0?(' · '+spec.onde.n+' onde'):''),4,14);
}

function drawModuli(ctx,CW,CH,spec,esploso){
  const W=+spec.W||600,H=+spec.H||400,cols=Math.max(1,+spec.cols||3),rows=Math.max(1,+spec.rows||2);
  const marginL=44,marginR=16,marginT=16,marginB=34,depth=20;
  const availW=CW-marginL-marginR-depth, availH=CH-marginT-marginB-depth;
  const sc=Math.min(availW/W,availH/H);
  const bw=W*sc,bh=H*sc;
  const x0=marginL+(availW-bw)/2, y0=marginT+(availH-bh)/2;
  const col='#E9E7E0';
  // estrusione retro
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+depth,y0-depth);ctx.lineTo(x0+depth+bw,y0-depth);ctx.lineTo(x0+bw,y0);ctx.closePath();
  ctx.fillStyle=shade(col,1.05);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x0+bw,y0);ctx.lineTo(x0+depth+bw,y0-depth);ctx.lineTo(x0+depth+bw,y0-depth+bh);ctx.lineTo(x0+bw,y0+bh);ctx.closePath();
  ctx.fillStyle=shade(col,.82);ctx.fill();ctx.stroke();
  // fronte contenitore
  ctx.fillStyle=col;ctx.fillRect(x0,y0,bw,bh);ctx.strokeStyle='#4A5560';ctx.lineWidth=1.6;ctx.strokeRect(x0,y0,bw,bh);
  // moduli
  const pad=Math.min(bw,bh)*0.05;
  const gw=(bw-pad*(cols+1))/cols, gh=(bh-pad*(rows+1))/rows;
  const pop=esploso?Math.min(gw,gh)*0.16:0;
  const cx=x0+bw/2, cy=y0+bh/2;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    let mx=x0+pad+c*(gw+pad), my=y0+pad+r*(gh+pad);
    if(esploso){const dirx=(mx+gw/2-cx),diry=(my+gh/2-cy);const dl=Math.hypot(dirx,diry)||1;mx+=dirx/dl*pop*3;my+=diry/dl*pop*3;}
    ctx.fillStyle=spec.colore||PAL[0];ctx.globalAlpha=.9;ctx.fillRect(mx,my,gw,gh);ctx.globalAlpha=1;
    ctx.strokeStyle=shade(spec.colore||PAL[0],.6);ctx.lineWidth=1;ctx.strokeRect(mx,my,gw,gh);
  }
  // fori lungo il bordo basso
  const nf=Math.min(+spec.fori||0,12);
  for(let i=0;i<nf;i++){const fx=x0+ (bw*(i+1)/(nf+1)), fy=y0+bh-6;
    ctx.beginPath();ctx.arc(fx,fy,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#8A4444';ctx.stroke();}
  // quote
  dimLine(ctx,x0,y0+bh+16,x0+bw,y0+bh+16,'L '+W);
  dimLine(ctx,x0-16,y0,x0-16,y0+bh,'H '+H);
  dimLine(ctx,x0+pad,y0+pad-7,x0+pad+gw,y0+pad-7,Math.round(W/cols-8)+'');
  ctx.font='600 11px ui-monospace,monospace';ctx.fillStyle='#6B7680';
  ctx.fillText((esploso?'esploso':'compatto')+' · '+cols+'×'+rows+' moduli',4,14);
}

function drawProfilo(ctx,CW,CH,spec,esploso){
  const parti=spec.parti||[];if(!parti.length)return;
  const totL=parti.reduce((s,p)=>s+(+p.lunghezza||0),0)||1;
  const maxD=Math.max(...parti.map(p=>+p.d||10));
  const gap=esploso?16:0, gaps=gap*(parti.length-1);
  const marginX=48,marginTop=30,marginBot=34;
  const availW=CW-marginX*2-gaps, availH=CH-marginTop-marginBot;
  const sc=Math.min(availW/totL, availH/maxD);
  const cy=marginTop+availH/2;
  let x=marginX;
  parti.forEach((p,idx)=>{
    const L=(+p.lunghezza||0)*sc, D=(+p.d||10)*sc, forma=p.forma||'cilindro';
    const top=cy-D/2, bot=cy+D/2;
    ctx.fillStyle=p.colore||PAL[idx%PAL.length];ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.2;
    if(forma==='cono'){
      // punta: triangolo che si assottiglia verso l'esterno (idx 0 = punta a sx)
      const tipLeft = idx===0;
      ctx.beginPath();
      if(tipLeft){ctx.moveTo(x,cy);ctx.lineTo(x+L,top);ctx.lineTo(x+L,bot);}
      else{ctx.moveTo(x,top);ctx.lineTo(x,bot);ctx.lineTo(x+L,cy);}
      ctx.closePath();ctx.fill();ctx.stroke();
    }else if(forma==='esagono'){
      const f=D*0.16;
      ctx.beginPath();ctx.rect(x,top,L,D);ctx.fill();ctx.stroke();
      ctx.fillStyle=shade(p.colore||'#888',1.2);ctx.fillRect(x,top,L,f);       // faccetta chiara sopra
      ctx.fillStyle=shade(p.colore||'#888',.8);ctx.fillRect(x,bot-f,L,f);      // faccetta scura sotto
      ctx.strokeRect(x,top,L,D);
    }else{ // cilindro
      const rr=Math.min(D/2,6);
      ctx.beginPath();ctx.moveTo(x+rr,top);ctx.lineTo(x+L-rr,top);
      ctx.quadraticCurveTo(x+L,top,x+L,top+rr);ctx.lineTo(x+L,bot-rr);ctx.quadraticCurveTo(x+L,bot,x+L-rr,bot);
      ctx.lineTo(x+rr,bot);ctx.quadraticCurveTo(x,bot,x,bot-rr);ctx.lineTo(x,top+rr);ctx.quadraticCurveTo(x,top,x+rr,top);
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x+rr,top+2,Math.max(0,L-rr*2),Math.max(1,D*0.16)); // riflesso
    }
    // nome + quota lunghezza
    ctx.font='600 9.5px ui-monospace,monospace';ctx.fillStyle='#4A5560';ctx.textAlign='center';
    if(L>26)ctx.fillText(p.nome||'',x+L/2,top-6);
    ctx.textAlign='left';
    dimLine(ctx,x,bot+14,x+L,bot+14,(+p.lunghezza||0)+'');
    x+=L+gap;
  });
  // quota totale + diametro
  dimLine(ctx,marginX,CH-12,x-gap,CH-12,'L '+totL);
  dimLine(ctx,marginX-14,cy-maxD*sc/2,marginX-14,cy+maxD*sc/2,'Ø'+maxD);
  ctx.font='600 11px ui-monospace,monospace';ctx.fillStyle='#6B7680';
  ctx.fillText((esploso?'esploso':'compatto')+' · '+parti.length+' parti',4,14);
}

// vista ASSIEME: parti posizionate in coordinate normalizzate 0..100 (elevazione frontale)
function drawAssieme(ctx,CW,CH,spec,esploso){
  const parti=(spec.parti||[]).filter(p=>!p.hidden);if(!parti.length)return;
  const marginL=46,marginR=20,marginT=18,marginB=34;
  const bw=CW-marginL-marginR, bh=CH-marginT-marginB;
  const N=(nx,ny)=>[marginL+nx/100*bw, marginT+ny/100*bh];
  // centroide per l'esploso
  let cx=0,cy=0;parti.forEach(p=>{cx+=p.x+p.w/2;cy+=p.y+p.h/2;});cx/=parti.length;cy/=parti.length;
  const k=esploso?0.35:0;
  parti.forEach(p=>{
    const ex=(p.x+p.w/2-cx)*k, ey=(p.y+p.h/2-cy)*k;
    const [x,y]=N(p.x+ex, p.y+ey);
    const w=p.w/100*bw, h=p.h/100*bh;
    ctx.fillStyle=p.colore||'#8AA9A6';ctx.strokeStyle='rgba(0,0,0,.32)';ctx.lineWidth=1.3;
    if(p.shape==='ellisse'){
      ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    }else{ // rect arrotondato
      const r=Math.min(w,h)*0.18;
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
      ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
    if(esploso && p.nome && w>18){ctx.font='600 9px ui-monospace,monospace';ctx.fillStyle='#4A5560';ctx.textAlign='center';ctx.fillText(p.nome,x+w/2,y-3);ctx.textAlign='left';}
  });
  // quote complessive dichiarate
  if(spec.H){const[,y0]=N(0,4),[,y1]=N(0,96);dimLine(ctx,marginL-16,y0,marginL-16,y1,'H '+spec.H);}
  if(spec.W){const[x0]=N(18,0),[x1]=N(82,0);dimLine(ctx,x0,CH-marginB+16,x1,CH-marginB+16,'base '+spec.W);}
  if(spec.Lseduta){const[sx]=N(30,0),[sx2]=N(70,0);dimLine(ctx,sx,marginT+bh*0.56,sx2,marginT+bh*0.56,'seduta '+spec.Lseduta);}
  ctx.font='600 11px ui-monospace,monospace';ctx.fillStyle='#6B7680';
  ctx.fillText((esploso?'esploso':'assieme')+' · '+parti.length+' componenti',4,14);
}

// costruisce l'assieme SEDIA dalle quote/variabili dichiarate
function buildSedia(dim,opts){

  const parti=[

    {key:'poggiatesta',nome:'Poggiatesta',riv:true,colore:riv,shape:'rect',x:41,y:1,w:18,h:7,hidden:!opts.poggiatesta},
    {key:'seduta',nome:'Seduta',riv:true,colore:riv,shape:'rect',x:30,y:40,w:40,h:12},
    {key:'bracciolo_sx',nome:'Bracciolo',colore:nero,shape:'rect',x:24,y:40,w:6,h:16,hidden:!opts.braccioli},
    {key:'bracciolo_dx',nome:'Bracciolo',colore:nero,shape:'rect',x:70,y:40,w:6,h:16,hidden:!opts.braccioli},
    {key:'pistone',nome:'Pistone',colore:metal,shape:'rect',x:47,y:52,w:6,h:22},

// helper: rettangolo arrotondato + gradiente verticale
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function vgrad(ctx,y,h,c1,c2){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}

// RENDERER SEDIA dedicato — razze, cuscini, volumi, ombre
function drawSedia(ctx,CW,CH,spec,esploso){
  const P=spec.parti||[];
  const findK=k=>P.find(p=>p.key===k)||{};
  const riv=findK('seduta').colore||'#4E5D6C';
  const rivHi=shade(riv,1.22), rivLo=shade(riv,.72);
  const metalHi='#D3D8DC', metal='#AEB5BB', metalLo='#868D93', nero='#33383F', neroHi='#4A5058';
  const braccioli=!findK('bracciolo_sx').hidden;
  const poggia=!findK('poggiatesta').hidden;

  const mL=48,mR=22,mT=14,mB=34;
  const bw=CW-mL-mR, bh=CH-mT-mB;
  const cx=mL+bw/2;
  const seatW=Math.max(bw*0.30, Math.min(bw*0.60,(spec.Lseduta||520)/700*bw*0.62));
  const g=esploso? bh*0.05 : 0;

  // ancore verticali (con scostamenti esploso)
  const seatTop = mT+bh*0.46 + (esploso?0:0);
  const seatH   = bh*0.085;
  const seatX   = cx-seatW/2;
  const backH   = bh*0.34, backW=seatW*0.86, backX=cx-backW/2;
  const backBottom = seatTop - g*1.2;
  const backTop = backBottom - backH;
  const cylTop  = seatTop+seatH + g*0.8;
  const baseY   = mT+bh*0.86 + g*1.6;
  const cylBottom = baseY;

  ctx.save();
  ctx.lineJoin='round';

  // ombra a terra
  ctx.save();ctx.fillStyle='rgba(30,35,45,.14)';
  ctx.beginPath();ctx.ellipse(cx,baseY+16,seatW*0.95,10,0,0,Math.PI*2);ctx.fill();ctx.restore();

  // ── BASE A STELLA (5 razze in prospettiva) + ruote ──
  const span=seatW*1.35, hub={x:cx,y:baseY};
  const castors=[];
  for(let i=0;i<5;i++){const f=(i/4-0.5);const wx=cx+f*span;const wy=baseY+14+(0.5-Math.abs(f))*-4;castors.push({x:wx,y:wy,f});}
  // razze (dietro all'hub)
  castors.forEach(c=>{
    ctx.beginPath();
    ctx.moveTo(hub.x-4,hub.y-2);ctx.lineTo(hub.x+4,hub.y-2);
    ctx.lineTo(c.x+5,c.y-3);ctx.lineTo(c.x-5,c.y-3);ctx.closePath();
    ctx.fillStyle=vgrad(ctx,baseY-6,12,metalHi,metalLo);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.stroke();
  });
  // ruote
  castors.forEach(c=>{
    ctx.beginPath();ctx.ellipse(c.x,c.y+3,7,5,0,0,Math.PI*2);
    ctx.fillStyle=vgrad(ctx,c.y-2,10,neroHi,nero);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
  });
  // hub
  ctx.beginPath();ctx.ellipse(hub.x,hub.y,10,5,0,0,Math.PI*2);
  ctx.fillStyle=vgrad(ctx,hub.y-5,10,metalHi,metal);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.stroke();

  // ── PISTONE (cilindro a gas) ──
  const cylW=Math.max(9,seatW*0.10);
  ctx.fillStyle=vgrad(ctx,cylTop,cylBottom-cylTop,metalHi,metalLo);
  rr(ctx,cx-cylW/2,cylTop,cylW,cylBottom-cylTop,cylW*0.3);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke();
  // riflesso pistone
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(cx-cylW*0.28,cylTop+2,cylW*0.18,cylBottom-cylTop-4);

  // ── BRACCIOLI (montante + bracciolo a L) ──
  if(braccioli){
    [-1,1].forEach(s=>{
      const px=cx+s*(seatW/2+6);
      // montante
      ctx.fillStyle=vgrad(ctx,seatTop-2,seatH+18,neroHi,nero);
      rr(ctx,px-3,seatTop-2,6,seatH+18,3);ctx.fill();
      // bracciolo (pad)
      const padW=seatW*0.26;
      ctx.fillStyle=vgrad(ctx,seatTop-14,10,'#4A5058',nero);
      rr(ctx, s<0? px-padW+4 : px-4, seatTop-14, padW, 10, 5);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.stroke();
    });
  }

  // ── SEDUTA (cuscino con fianco/bolster e spessore) ──
  // spessore frontale
  ctx.fillStyle=rivLo;rr(ctx,seatX,seatTop+seatH*0.55,seatW,seatH*0.7,seatH*0.35);ctx.fill();
  // top cuscino
  ctx.fillStyle=vgrad(ctx,seatTop,seatH,rivHi,riv);
  rr(ctx,seatX,seatTop,seatW,seatH,seatH*0.45);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1.2;ctx.stroke();
  // bolster laterali (rilievi)
  ctx.fillStyle=shade(riv,1.1);
  rr(ctx,seatX+2,seatTop+2,seatW*0.14,seatH-4,seatH*0.3);ctx.fill();
  rr(ctx,seatX+seatW-2-seatW*0.14,seatTop+2,seatW*0.14,seatH-4,seatH*0.3);ctx.fill();

  // ── SCHIENALE (sagomato, con lombare) ──
  ctx.fillStyle=vgrad(ctx,backTop,backH,rivHi,riv);
  // profilo con vita stretta (lombare)
  const bx=backX,bw2=backW,bt=backTop,bb=backBottom,waist=bw2*0.12;
  ctx.beginPath();
  ctx.moveTo(bx+bw2*0.14,bt);
  ctx.quadraticCurveTo(bx,bt,bx,bt+backH*0.18);
  ctx.quadraticCurveTo(bx+waist*0.3,bt+backH*0.55,bx+bw2*0.06,bb-4); // fianco sx con lombare
  ctx.quadraticCurveTo(bx,bb,bx+bw2*0.16,bb);
  ctx.lineTo(bx+bw2*0.84,bb);
  ctx.quadraticCurveTo(bx+bw2,bb,bx+bw2*0.94,bb-4);
  ctx.quadraticCurveTo(bx+bw2-waist*0.3,bt+backH*0.55,bx+bw2,bt+backH*0.18);
  ctx.quadraticCurveTo(bx+bw2,bt,bx+bw2*0.86,bt);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1.2;ctx.stroke();
  // cucitura centrale + lombare
  ctx.strokeStyle=shade(riv,.72);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx,bt+6);ctx.lineTo(cx,bb-6);ctx.stroke();
  ctx.strokeStyle=shade(riv,1.25);ctx.beginPath();ctx.ellipse(cx,bt+backH*0.62,bw2*0.28,backH*0.12,0,0,Math.PI*2);ctx.stroke();

  // ── POGGIATESTA ──
  if(poggia){
    const phW=backW*0.6, phH=bh*0.09, phx=cx-phW/2, phy=backTop-phH-g*0.8;
    ctx.fillStyle=vgrad(ctx,phy,phH,rivHi,riv);rr(ctx,phx,phy,phW,phH,phH*0.4);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.28)';ctx.stroke();
    // collo
    ctx.fillStyle=nero;ctx.fillRect(cx-3,phy+phH-2,6,backTop-(phy+phH)+4);
  }

  ctx.restore();

  // ── QUOTE ──
  if(spec.H) dimLine(ctx,mL-16,backTop,mL-16,baseY+8,'H '+spec.H);
  if(spec.Lseduta) dimLine(ctx,seatX,seatTop-4,seatX+seatW,seatTop-4,'seduta '+spec.Lseduta);
  if(spec.W) dimLine(ctx,cx-span/2,CH-mB+16,cx+span/2,CH-mB+16,'base '+spec.W);
  ctx.font='600 11px ui-monospace,monospace';ctx.fillStyle='#6B7680';
  ctx.fillText((esploso?'esploso':'assieme')+' · sedia',4,14);
}


/* ── DISEGNATORE PROFILO (pressato) — 2D canvas ── */
function drawProfiloLib(canvas,spec){
  var dpr=Math.min(window.devicePixelRatio||1,2);var CW=canvas.clientWidth||520,CH=canvas.clientHeight||280;
  canvas.width=CW*dpr;canvas.height=CH*dpr;var ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,CW,CH);
  var out=spec.outline;if(!out||!out.length)return;
  var xs=out.map(function(p){return p.x;}),ys=out.map(function(p){return p.y;});
  var minx=Math.min.apply(null,xs),maxx=Math.max.apply(null,xs),miny=Math.min.apply(null,ys),maxy=Math.max.apply(null,ys);
  var w=(maxx-minx)||1,h=(maxy-miny)||1,pad=46,sc=Math.min((CW-pad*2)/w,(CH-pad*2)/h);
  var ox=CW/2,oy=CH/2,cx=(minx+maxx)/2,cy=(miny+maxy)/2;
  function X(x){return ox+(x-cx)*sc;}function Y(y){return oy-(y-cy)*sc;}
  ctx.beginPath();out.forEach(function(p,i){i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y));});ctx.closePath();
  ctx.fillStyle=spec.colore||'#B4C4D6';ctx.fill();ctx.strokeStyle='#3A3F45';ctx.lineWidth=1.5;ctx.stroke();
  (spec.fori||[]).forEach(function(f){ctx.beginPath();ctx.arc(X(f.cx),Y(f.cy),(f.d/2)*sc,0,Math.PI*2);ctx.fillStyle='#FBFBFA';ctx.fill();ctx.strokeStyle='#8A4444';ctx.lineWidth=1.2;ctx.stroke();});
  ctx.font='11px ui-monospace,monospace';ctx.fillStyle='#6B7680';ctx.fillText(Math.round(w)+' × '+Math.round(h)+' cm',pad,CH-14);
}

/* ── DISEGNATORE DXF (mostra la geometria del CAD caricato) ── */
function drawDXF(canvas,geom){
  if(!geom||!canvas)return; var dpr=Math.min(window.devicePixelRatio||1,2);
  var CW=canvas.clientWidth||520,CH=canvas.clientHeight||220;
  canvas.width=CW*dpr;canvas.height=CH*dpr;var ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,CW,CH);
  var b=geom.bounds; if(!b)return; var w=(b.maxX-b.minX)||1,h=(b.maxY-b.minY)||1,pad=18,sc=Math.min((CW-pad*2)/w,(CH-pad*2)/h);
  var ox=pad+(CW-pad*2-w*sc)/2, oy=pad+(CH-pad*2-h*sc)/2;
  function X(x){return ox+(x-b.minX)*sc;} function Y(y){return CH-(oy+(y-b.minY)*sc);}
  ctx.strokeStyle='#2E3A46';ctx.lineWidth=1.2;ctx.lineJoin='round';
  (geom.polys||[]).forEach(function(p){ctx.beginPath();(p.pts||[]).forEach(function(pt,i){i?ctx.lineTo(X(pt[0]),Y(pt[1])):ctx.moveTo(X(pt[0]),Y(pt[1]));});if(p.closed)ctx.closePath();ctx.stroke();});
  ctx.strokeStyle='#0E6B66';
  (geom.circles||[]).forEach(function(c){ctx.beginPath();ctx.arc(X(c.cx),Y(c.cy),Math.max(1,c.r*sc),0,Math.PI*2);ctx.stroke();});
}

/* ── MOTORE 3D (assieme) — attivo con Three.js; offline si usa il fallback 2.5D ── */
var _3d=null;
function stop3D(){if(_3d){cancelAnimationFrame(_3d.raf);_3d=null;}}
function _m3(kind,color){if(kind==='metal')return new THREE.MeshStandardMaterial({color:color||0xAEB5BB,roughness:.35,metalness:.85});if(kind==='uph')return new THREE.MeshStandardMaterial({color:color,roughness:.85,metalness:.02});return new THREE.MeshStandardMaterial({color:color||0x33383F,roughness:.55,metalness:.15});}
function _sh(o){o.traverse(function(m){if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});return o;}
var MATTONI3D={
  /* (05ago2026) LASTRA SAGOMATA — il pressato.
     Il contorno arriva come lista di punti (rettangolo stondato, poligono a N lati,
     ellisse: li produce gia' outlinePointsFor). I fori diventano `holes` della Shape,
     quindi sono BUCHI PASSANTI veri, non cilindri appoggiati sopra. Una lastra per
     ogni strato: cosi' un triangolo a tre strati con due fori si compone davvero. */
  sagomata:function(p){
    var pts=p.pts||[], fori=p.fori||[], H=Math.max(0.002,p.h||0.02);
    if(pts.length<3) return _sh(new THREE.Mesh(new THREE.BoxGeometry(0.1,H,0.1),_m3('uph',p.color)));
    var sh=new THREE.Shape();
    sh.moveTo(pts[0][0], pts[0][1]);
    for(var i=1;i<pts.length;i++) sh.lineTo(pts[i][0], pts[i][1]);
    sh.closePath();
    fori.forEach(function(f){
      var r=(+f.r||0); if(!(r>0)) return;
      var h=new THREE.Path();
      h.absarc(+f.x||0, +f.y||0, r, 0, Math.PI*2, true);
      sh.holes.push(h);
    });
    var g=new THREE.ExtrudeGeometry(sh,{depth:H,bevelEnabled:false,curveSegments:48});
    g.rotateX(-Math.PI/2);          /* estrusa lungo Z: la porto verticale, Y in alto */
    g.translate(0,H,0);
    g.computeVertexNormals();
    return _sh(new THREE.Mesh(g,_m3('uph',p.color)));
  },
  /* (04ago2026) LASTRA GENERATA. Un GLB ha un numero di pezzi fisso: se il prodotto
     ha piu' strati di quanti ne ha il modello, quelli in piu' non possono comparire.
     Questa lastra invece NASCE dai numeri — larghezza, profondita', spessore, onde —
     quindi il numero di strati e le misure non hanno alcun limite. */
  /* (07ago2026) MOLLEGGIO — lo strato a molle non e' una lastra ne' una scatola:
     e' una griglia di spirali fra due piani sottili. Una sola geometria di molla,
     clonata su tutte le posizioni: N mesh ma 1 geometry, cosi' non pesa. */
  molleggio:function(p){
    var W=p.w||1, D=p.d||1, H=Math.max(0.02,p.h||0.08);
    var g=new THREE.Group();
    var colM=(p.color!=null)?p.color:0x8A9299;
    try{
      var passo=Math.max(0.045, Math.min(W,D)/9);
      var nx=Math.max(2, Math.min(9, Math.round(W/passo)));
      var nz=Math.max(2, Math.min(14, Math.round(D/passo)));
      var rM=Math.min(W/nx, D/nz)*0.34;
      var spire=4, seg=Math.max(24, spire*10);
      var pts=[];
      for(var t=0;t<=seg;t++){
        var a=(t/seg)*Math.PI*2*spire;
        pts.push(new THREE.Vector3(Math.cos(a)*rM, (t/seg)*H - H/2, Math.sin(a)*rM));
      }
      var curva=new THREE.CatmullRomCurve3(pts);
      var gm=new THREE.TubeGeometry(curva, seg, Math.max(0.004, rM*0.16), 5, false);
      var mm=_m3('metal', colM);
      for(var ix=0; ix<nx; ix++) for(var iz=0; iz<nz; iz++){
        var m=new THREE.Mesh(gm, mm);
        m.position.set((ix+0.5)/nx*W - W/2, 0, (iz+0.5)/nz*D - D/2);
        g.add(m);
      }
      /* i due piani di contenimento: senza, le molle sembrano sospese */
      var sp=Math.max(0.004, H*0.06);
      [1,-1].forEach(function(s){
        var pl=new THREE.Mesh(new THREE.BoxGeometry(W, sp, D), _m3('uph', colM));
        pl.position.y = s*(H/2 - sp/2);
        g.add(pl);
      });
    }catch(e){
      /* se qualcosa non e' disponibile nella build di Three, resta la scatola:
         meglio uno strato liscio che un 3D che non parte. */
      g.add(new THREE.Mesh(new THREE.BoxGeometry(W,H,D), _m3('uph', colM)));
    }
    return _sh(g);
  },
  lastra:function(p){
    /* (04ago2026 - corretto) Come nel disegno 2D del prodotto:
       - l'onda corre lungo la LUNGHEZZA (l'asse lungo), non attraverso;
       - le facce esterne del materasso sono PIATTE (sopra ci si dorme, sotto appoggia);
       - le facce interne sono ondulate e hanno la STESSA onda sopra e sotto,
         percio' lo strato ha spessore costante e gli strati SI ANNIDANO. */
    var W=p.w||1, D=p.d||1, H=p.h||0.05, N=+p.onde||0, A=+p.amp||0;
    var pianoSu=!!p.pianoSu, pianoGiu=!!p.pianoGiu;
    if(!(N>0)) A=0;
    /* ── ZONE DI LAVORAZIONE (09ago2026) ────────────────────────────────────
       Uno strato non e' uniforme da testa a piedi. Nel materasso Osiris il torba
       ha zig-zag nelle fasce spalle e piedi e inserti al centro: e' quella
       zonizzazione a dare le zone di portanza, cioe' E' il prodotto.
       La posizione della zona e' in PERCENTUALE (segue il corpo), la dimensione
       dell'inserto in mm assoluti (la decide l'utensile).
       Ai bordi di ogni zona il profilo SFUMA su ~8% della sua ampiezza: senza,
       si vedrebbe uno scalino netto che nella schiuma non esiste. */
    var ZN=Array.isArray(p.zone)?p.zone:[];
    var _hasZ=ZN.length>0;
    var nz=Math.max(2, Math.min(_hasZ?320:160, Math.round(_hasZ? Math.max(120,N*16) : (N>0? N*16 : 4))));
    var nx=4;
    var pos=[], idx=[];
    function _prof(t){                       /* t = 0..1 lungo la lunghezza */
      var base=A*Math.sin(t*N*Math.PI*2);
      if(!_hasZ) return base;

        var z=ZN[i], da=(+z.da||0)/100, a=(+z.a||0)/100;
        if(a<da){var w=da;da=a;a=w;}
        if(t<da||t>a) continue;
        var L=Math.max(1e-6,a-da), u=(t-da)/L;            /* 0..1 dentro la zona */
        var sf=Math.min(1, Math.min(u,1-u)/0.08);          /* sfumatura ai bordi */
        var v=base;
        switch(String(z.lav||'')){
          case 'zigzag':   /* onda triangolare piu' fitta: il taglio a denti */
            var f=Math.max(2,Math.round(L*N*3));
            var x=(u*f)%1; v=A*1.15*(4*Math.abs(x-0.5)-1); break;
          case 'inserto':  /* lente: un rilievo unico e morbido al centro della zona */
            v=A*1.9*Math.sin(Math.PI*u); break;
          case 'bugna':    /* rilievi fitti e bassi */
            v=base+A*0.45*Math.sin(u*Math.max(6,L*60)*Math.PI*2); break;
          case 'scavo':    /* materiale asportato */
            v=base-A*1.5*Math.sin(Math.PI*u); break;
          case 'foro':
            v=base-A*2.2*Math.sin(Math.PI*u); break;
          case 'piena':    /* nessuna lavorazione: piatto */
            v=0; break;
          default: return base;
        }
        return base+(v-base)*sf;
      }
      return base;
    }
    function onda(v){ return _prof(v/nz); }
    function q(u,v,alto){
      var x=(u/nx-0.5)*W, z=(v/nz-0.5)*D;
      var o=onda(v);
      var y = alto ? ( H/2 + (pianoSu?0:o) )
                   : (-H/2 + (pianoGiu?0:o) );
      return [x,y,z];
    }

/* ── COSTO DAL PESO (09ago2026) — la formula dell'ufficio tecnico ─────────────
   Loro non partono dal costo del blocco: partono dal costo al CHILO. Il peso del

     costo = costo_kg × peso

   volume della lastra — ma e' corretto ed e' piu' onesto: cosi' il costo si
   porta dentro lo SFRIDO. Le 36 lastre che escono da un blocco pesano meno del

}

  var head=L[0].split(sep).map(function(h){return h.trim().replace(/^"|"$/g,'');});

function _glbNodi(dataUrl){
  try{
    var b64=String(dataUrl).split(',')[1]; var bin=atob(b64);
    var buf=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
    var dv=new DataView(buf.buffer);
    if(dv.getUint32(0,true)!==0x46546C67) return [];
    var clen=dv.getUint32(12,true);
    var j=JSON.parse(new TextDecoder().decode(buf.subarray(20,20+clen)));
    return (j.nodes||[]).filter(function(n){return n.mesh!=null;}).map(function(n){return (n.name||'').trim();}).filter(function(x){return x;});
  }catch(e){ return []; }
}

/* ── VOCABOLARIO: la parola del CAMPO (italiano) → il nome del PEZZO nel GLB (spesso inglese) ──
   Senza questo, "colore tessuto" non trova mai "CURTAIN_LEFT_FOLD_01". */
/* radice della parola: toglie la desinenza per far combaciare singolare e plurale
   (pomoli/pomolo, aste/asta, supporti/supporto). Sotto le 4 lettere non taglio:
   una radice troppo corta abbinerebbe pezzi a caso. */
function _radice(w){
  w=String(w||'').toLowerCase();
  if(w.length<5) return w;
  return w.replace(/(hi|he|i|e|o|a)$/,'');
}
/* le forme della stessa parola: plurale <-> singolare piu' la radice.
   aste->asta, pomoli->pomolo, supporti->supporto, ganci->gancio */
function _formeDi(w){
  w=String(w||'').toLowerCase();
  var f=[w];
  if(/i$/.test(w)){ f.push(w.slice(0,-1)+'o', w.slice(0,-1)+'e', w.slice(0,-1)+'a'); }
  if(/e$/.test(w)){ f.push(w.slice(0,-1)+'a'); }
  if(/hi$/.test(w)){ f.push(w.slice(0,-2)+'co'); }
  if(/he$/.test(w)){ f.push(w.slice(0,-2)+'ca'); }
  var r=_radice(w); if(r&&f.indexOf(r)<0) f.push(r);
  return f.filter(function(x,i){ return x && f.indexOf(x)===i; });
}

function applicaMisureGLB3(m,parti,cfg,campi,ASSE,base){

    function fatt(ruoli,re){               /* quanto vale il campo rispetto alla misura di nascita */
      var k=null;
      campi.forEach(function(c){

      var rif=(c.std&&c.std.length)? parseFloat(String(c.std[0]).replace(',','.')) : null;
      if(!rif||!(rif>0))return;
      var kk=(c.id+' '+(c.label||'')).toLowerCase(), a=null;

    var v=cfg?cfg[c.id]:null;
    if(v===undefined||v===null||v==='') return;
    var hex=(typeof _tint==='function')? _tint(v) : null;
    if(hex==null){ console.warn('[colore] "'+v+'" (campo '+(c.label||c.id)+') non e\' un colore riconosciuto: usa un nome della tavolozza o un esadecimale tipo #C1272D'); return; }

function _applicaLen(v,len,pad,eraSigla){
  v=String(v==null?'':v);
  if(!len||len<=0) return v;
  if(v.length>len){
    /* Troncare va bene SOLO su una sigla (LT). Su un valore libero (una misura
       come 160x200) troncare lo mutila: meglio avvisare e lasciarlo intero,
       cos\u00ec l'errore \u00e8 visibile e non silenzioso. */
    if(eraSigla) return v.slice(0,len);
    if(typeof console!=='undefined') console.warn('[codice] valore "'+v+'" ('+v.length+' car.) supera la lunghezza '+len+' e non ha una sigla: serve una codifica per questo campo. Lasciato intero.');
    return v;
  }
  var fill=(pad==='spazi')?' ':(pad==='zeri')?'0':'';
  if(!fill) return v;
  while(v.length<len) v=fill+v;
  return v;
}
function codiceRiga(riga){
  var lib=LIB[riga.lib], C=lib.codice||{};
  var parts=(C.pos||[]).map(function(p){
    var v=riga.cfg[p];
    var vv=(lib.campi||[]).find(function(c){return c.id===p;});
    var eraSigla=false;
    if(vv&&vv.cod&&vv.cod[v]!=null){ v=vv.cod[v]; eraSigla=true; }   /* usa la sigla se c'è */
    var len=(C.len&&C.len[p])||0;
    return _applicaLen(v,len,C.pad||'zeri',eraSigla);

  var pre=(C.pre!=null)?C.pre:'#';
  /* (07ago2026) una regola puo' aggiungere un segmento al codice (tipo:'codice') */

  return C.padre + pre + parts.join(sep);
}

/* (10ago2026) _avviso ERA CHIAMATA IN 16 PUNTI E NON ESISTEVA. Ogni chiamata

/* ── COSA VA AL GESTIONALE ──
   Non le scelte grezze: il PACCHETTO COMPLETO. Codice padre, descrizione, varianti,
   distinta (coi codici già varianti), cicli, prezzo. L'ERP riceve e usa: non deve
   ricalcolare né indovinare niente. */
/* ══ FIRMA ESATTA ═══════════════════════════════════════════════════
   L'impronta univoca di una configurazione. Ogni elemento conta
   (160x200 \u2260 161x200). Serve a: riconoscere \"gi\u00e0 fatto\", per chi,
   e a clonare un prodotto esistente. Stabile: stesso prodotto \u2192 stessa
   firma, sempre, indipendente dall'ordine dei campi. ══ */
function _firmaRiga(riga){
  var lib=LIB[riga.lib]; if(!lib) return null;
  /* Firma RICCA: rappresenta il prodotto per intero. Per gli strati produce
     n_strati, strati1..N ognuno {col;h;mat}, e strati_h_tot. Formato stabile
     e leggibile, allineato a come nascono gli ordini reali. */
  var coppie=_coppieDi(riga.cfg||{});
  var base=(riga.lib||'')+'::'+coppie.join('|');
  return { testo: base, hash: _hashStr(base) };
}
/* Le COPPIE che descrivono la composizione. Una sola definizione, usata sia
   dalla firma sia dal riconoscimento: se le due divergono, l'imbuto non
   stringe mai e il pannello non arriva mai a dire "identico". */
function _coppieDi(cfg){
  var coppie=[];
  Object.keys(cfg||{}).forEach(function(k){
    var v=cfg[k];
    if(v===undefined || v===null || v==='') return;
    if(Array.isArray(v)){
      /* elemento dinamico (strati): conteggio + ogni voce numerata + somma h */
      coppie.push('n_'+k+'='+v.length);
      var htot=0;
      v.forEach(function(el,i){
        if(el && typeof el==='object'){
          var parti=['col','h','mat'].filter(function(kk){return el[kk]!==undefined;})
                     .map(function(kk){return kk+':'+String(el[kk]);}).join(';');
          coppie.push(k+(i+1)+'={'+parti+'}');
          if(el.h!==undefined) htot+=(+el.h||0);
        } else {
          coppie.push(k+(i+1)+'='+String(el));
        }
      });
      coppie.push(k+'_h_tot='+htot);
    } else if(typeof v==='object'){
      coppie.push(k+'='+Object.keys(v).sort().map(function(kk){return kk+':'+String(v[kk]);}).join(';'));
    } else {
      coppie.push(k+'='+String(v));
    }
  });
  return coppie;
}
/* hash deterministico corto (djb2) — non crittografico, serve solo come indice stabile */
function _hashStr(str){
  var h=5381; for(var i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; }
  return ('00000000'+h.toString(16)).slice(-8);
}
/* ══ FIRMA PROGRESSIVA ═══════════════════════════════════════════════
   Restituisce l'elenco delle scelte fatte FINORA (campo=valore), come
   insieme. Serve al riconoscimento incrementale: mentre componi, si
   cercano gli ordini che contengono TUTTE queste scelte. Man mano che
   aggiungi, l'insieme cresce e i candidati si restringono \u2014 l'imbuto. */
function _scelteCorrenti(riga){
  var lib=LIB[riga.lib]; if(!lib) return {lib:'',scelte:[]};
  /* (04ago2026) Prima si guardavano solo i `campi` dichiarati: sul materasso
     era la sola misura, e gli strati — che stanno negli `elementi` — restavano
     fuori. Risultato: il pannello si accendeva sulla misura e non stringeva
     mai, e non poteva mai dire "identico". Ora le scelte sono le stesse coppie
     della firma, quindi l'imbuto stringe davvero a ogni strato aggiunto. */
  var scelte=_coppieDi(riga.cfg||{});
  scelte.sort();
  return {lib:riga.lib, scelte:scelte};
}
/* chiede al server: chi ha gia' fatto qualcosa che contiene queste scelte?
   cb riceve {gia_fatto, per_cliente, per_altri, quanti, esatto} */
function riconosciProgressivo(riga, clienteCorrente, cb){
  var sc=_scelteCorrenti(riga);
  if(!sc.scelte.length){ cb({gia_fatto:false, quanti:0, per_cliente:0, per_altri:0}); return; }
  fetch('/api/riconosci', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lib:sc.lib, scelte:sc.scelte, cliente:clienteCorrente||''})})
  .then(function(r){return r.json();})
  .then(cb)
  .catch(function(){ cb(null); });   /* offline: nessun riconoscimento, non blocca */
}
function payloadOrdine(){
  return {
    schema:'MM-1',
    mondo:mondoCorrente, marchio:BRAND,
    cliente:ordine.cliente, agente:(ordine.agente||''), data:ordine.data,
    righe: ordine.righe.map(function(r){
      var lib=LIB[r.lib], C=calcRiga(r);
      var A=(typeof analisiRiga==='function')? analisiRiga(r,C) : null;
      return {
        articolo_padre: (lib.codice&&lib.codice.padre)? lib.codice.padre : String(r.lib).toUpperCase().substring(0,12),
        codice_variante: (typeof codiceRiga==='function' && lib.codice)? codiceRiga(r) : null,
        grammatica: (lib.codice)? { padre:lib.codice.padre, segmenti:(lib.codice.pos||[]), lunghezze:(lib.codice.len||{}), riempimento:(lib.codice.pad||'zeri'), sep_padre:(lib.codice.pre!=null?lib.codice.pre:'#'), sep_varianti:(lib.codice.sep!=null?lib.codice.sep:',') } : null,

        cicli: (C.cicli||[]).map(function(c){ return {reparto:c.reparto, fase:c.fase, minuti:c.min}; }),
        prezzo_unitario: A? +A.prezzo.toFixed(2) : null,
        costo_unitario:  A? +A.costo.toFixed(2)  : null,
        /* MOTIVAZIONE DEL PREZZO (07ago2026) — l'ERP non riceve le regole (sono know-how

        prezzo_origine: (C.ricaricoMotivo? 'regola' : 'listino'),

        maggiorazione_pct: C.maggiora||0,
        listino: (function(){ try{ var l=_listinoDi(ordine.cliente||'', ordine.agente||''); return l?(l.nome||l.id||l.listino||null):null; }catch(e){ return null; } })(),
        firma: (typeof _firmaRiga==='function')? _firmaRiga(r) : null,   /* l'impronta esatta */
        /* (04ago2026) Senza queste due righe l'ordine non si puo' RIAPRIRE: il payload
           descriveva il prodotto per l'ERP (varianti, distinta, cicli) ma non conservava
           come ricostruirlo qui dentro. Il richiamo dal pannello giallo andava in errore.

        lib: r.lib,
        cfg: r.cfg,

        origine_configurazione: ((r.intervista&&r.intervista.length)?'intervista':'manuale'),

        intervista: (r.intervista||[]).map(function(x){return {domanda:x.domanda, risposta:x.risposta, campo:x.campo||null};})
      };
    })

}
/* (11ago2026) L'OFFERTA SI', L'ORDINE NO. Il commerciale deve poter quotare —

function _varianteNonApprovata(){
  var out=[];
  (ordine.righe||[]).forEach(function(r){
    if(!r.variante) return;

      out.push(r.variante.nome+' — '+({'in attesa':'in attesa di approvazione','rifiutata':'rifiutata'+(A.motivo?(': '+A.motivo):''),
        'scaduta':'richiesta scaduta senza risposta','non chiesta':'approvazione mai chiesta'}[A.stato]||A.stato));
  });

}
function ordineHaBlocchi(){

/* ══════ APPROVAZIONE DELLE VARIANTI (11ago2026) ══════════════════════════════
   Una variante nasceva «da approvare» e restava tale per sempre: nessuno la
   approvava, nessuno veniva avvisato, e l'ordine si registrava lo stesso. Peggio
   che non marcarla — dava l'impressione di un controllo che non c'era.

   Il vincolo vero e' il tempo: il commerciale e' DAL CLIENTE e non puo' aspettare.
   Quindi la richiesta non e' una mail — una mail non e' una risposta, resta nella
   casella di chi la legge e il sistema non sa niente. Qui la richiesta e' un
   record sul server: il responsabile la apre e preme, e l'esito torna dove serve,
   visibile al commerciale mentre e' ancora seduto davanti al cliente.

   E ha una SCADENZA: se nessuno risponde entro il tempo, la richiesta scade e il
   commerciale lo sa — invece di aspettare al buio. */
var APPROVA_MINUTI=60;

function _chiaveVar(r){
  return String(ordine.numero||'')+'·'+String((r&&r.variante&&r.variante.nome)||'');
}
function _statoApprovazione(r){
  if(!r||!r.variante) return null;
  var k=_chiaveVar(r);
  var A=(ANAG.approvazioni||[]).filter(function(x){return String(x.chiave||'')===k;})
        .sort(function(a,b){return String(b.chiesto_il||'').localeCompare(String(a.chiesto_il||''));})[0];
  if(!A) return {stato:'non chiesta'};
  if(A.stato==='in attesa'){
    var t=Date.parse(A.scadenza||'')||0;
    if(t && Date.now()>t) return Object.assign({},A,{stato:'scaduta'});

function chiediApprovazione(r){
  if(!r||!r.variante){ _avviso('Nessuna variante da approvare su questa riga.'); return; }
  var ora=new Date(), sc=new Date(ora.getTime()+APPROVA_MINUTI*60000);
  var rec={chiave:_chiaveVar(r), variante:r.variante.nome, prodotto:r.variante.da,
           cliente:(ordine.cliente||''), ordine:(ordine.numero||''),
           chiesto_da:RUOLO, chiesto_il:ora.toISOString(), scadenza:sc.toISOString(),
           stato:'in attesa', motivo:'', deciso_da:'', deciso_il:''};
  ANAG.approvazioni=(ANAG.approvazioni||[]).filter(function(x){return x.chiave!==rec.chiave;});
  ANAG.approvazioni.push(rec);
  anagScrivi('approvazioni', ANAG.approvazioni, function(){
    _avviso('Richiesta inviata — risposta attesa entro '+APPROVA_MINUTI+' minuti.');
    renderAll();
  });
}
function decidiApprovazione(chiave, esito, motivo){
  var A=(ANAG.approvazioni||[]);
  var i=-1; A.forEach(function(x,j){ if(String(x.chiave)===String(chiave)) i=j; });
  if(i<0) return;
  A[i].stato=esito; A[i].motivo=motivo||'';
  A[i].deciso_da=RUOLO; A[i].deciso_il=new Date().toISOString();
  anagScrivi('approvazioni', A, function(){
    _avviso('Variante «'+A[i].variante+'» '+(esito==='approvata'?'approvata':'rifiutata')+'.');
    renderAll();
  });
}
function _inAttesa(){
  return (ANAG.approvazioni||[]).filter(function(x){
    if(x.stato!=='in attesa') return false;
    var t=Date.parse(x.scadenza||'')||0;
    return !(t && Date.now()>t);
  });
}
function _scadute(){
  return (ANAG.approvazioni||[]).filter(function(x){
    if(x.stato!=='in attesa') return false;
    var t=Date.parse(x.scadenza||'')||0;
    return (t && Date.now()>t);
  });
}
